<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>臺灣即時氣象資料</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<!-- Chart.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
  --green: #2ea043;
  --green-glow: rgba(46,160,67,0.35);
  --gray: #484f58;
}

[data-theme="dark"] {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #21262d;
  --border: #30363d;
  --text: #e6edf3;
  --text-muted: #7d8590;
  --accent: #58a6ff;
  --map-bg: #1a1f27;
  --legend-bg: rgba(22,27,34,0.92);
  --legend-border: rgba(48,54,61,0.9);
}
[data-theme="light"] {
  --bg: #f0f4f8;
  --surface: #ffffff;
  --surface2: #f0f2f5;
  --border: #d0d7de;
  --text: #1f2328;
  --text-muted: #656d76;
  --accent: #0969da;
  --map-bg: #e8ecf0;
  --legend-bg: rgba(255,255,255,0.95);
  --legend-border: rgba(208,215,222,0.95);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: background 0.3s, color 0.3s;
}

/* ── Header ── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  height: 50px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  z-index: 1000;
  gap: 12px;
}
.header-left { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.logo { font-size: 15px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
/* Stats inline in header */
.header-stats {
  display: flex; align-items: center; gap: 12px;
  font-size: 12px; flex: 1; min-width: 0;
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  padding: 0 14px; white-space: nowrap;
}
.header-stats .stat-item { display: flex; align-items: center; gap: 5px; }
.header-stats .stat-count { font-weight: 700; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
.header-stats .stat-label { color: var(--text-muted); font-size: 11px; }
.header-stats .divider { width: 1px; height: 14px; background: var(--border); flex-shrink: 0; }
.status-badge { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse-dot 2s ease-in-out infinite; }
@keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.8)} }
.last-update { font-size: 11px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
.theme-toggle {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  padding: 4px 10px; border-radius: 20px; font-size: 13px; cursor: pointer;
  display: flex; align-items: center; gap: 5px; font-family: 'Noto Sans TC', sans-serif;
  transition: all 0.2s;
}
.theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
.author-credit {
  font-size: 11px; color: var(--text-muted);
  font-family: 'Noto Sans TC', sans-serif;
  white-space: nowrap; display: flex; align-items: center; gap: 4px;
  border-left: 1px solid var(--border); padding-left: 10px;
}
.author-home-link {
  font-size: 13px; text-decoration: none;
  transition: opacity 0.15s; opacity: 0.8;
}
.author-home-link:hover { opacity: 1; }
.refresh-btn {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  padding: 4px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
  font-family: 'Noto Sans TC', sans-serif; transition: all 0.2s;
}
.refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
/* 手機版列表收合按鈕：桌機隱藏 */
.mobile-list-btn {
  display: none;
  background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer;
  font-family: 'Noto Sans TC', sans-serif; transition: all 0.2s; white-space: nowrap;
}
.mobile-list-btn:hover { border-color: var(--accent); color: var(--accent); }
.mobile-list-btn.list-open { border-color: var(--accent); color: var(--accent); background: rgba(88,166,255,0.1); }

/* ── Stats Bar (hidden, moved into header) ── */
.stats-bar { display: none; }
.stat-item { display: flex; align-items: center; gap: 6px; }
.stat-count { font-weight: 700; font-family: 'JetBrains Mono', monospace; }
.stat-label { color: var(--text-muted); }
.stats-bar .divider { width: 1px; height: 14px; background: var(--border); }

/* ── Main Layout ── */
.map-area { display: flex; flex: 1; overflow: hidden; flex-direction: column; }
.content-wrap { display: flex; flex: 1; overflow: hidden; }
.main { display: flex; flex: 1; overflow: hidden; position: relative; }
#map { flex: 1; background: var(--map-bg); }

/* ── 要素工具列（頂端兩列） ── */
.elem-toolbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 4px 16px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  flex-shrink: 0;
}
.elem-toolbar-row {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: nowrap;
}
.elem-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 11px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  cursor: pointer;
  font-size: 12px;
  font-family: 'Noto Sans TC', sans-serif;
  color: var(--text-muted);
  transition: all 0.15s;
  white-space: nowrap;
  flex-shrink: 0;
}
.elem-btn:hover { background: var(--surface2); color: var(--text); border-color: var(--text-muted); }
.elem-btn.active { border-color: var(--accent); background: rgba(88,166,255,0.12); color: var(--accent); font-weight: 600; }
.elem-icon { font-size: 13px; }
.elem-unit { font-size: 10px; opacity: 0.7; font-family: 'JetBrains Mono', monospace; }
.toolbar-divider { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; margin: 0 4px; }

/* ── 直式色階（地圖左下角） ── */
.color-scale-panel {
  position: absolute;
  bottom: 24px;
  left: 12px;
  top: auto;
  transform: none;
  z-index: 500;
  background: var(--legend-bg);
  border: 1px solid var(--legend-border);
  border-radius: 10px;
  padding: 10px 10px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  min-width: 52px;
}
.color-scale-title {
  font-size: 9px;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  text-align: center;
  white-space: nowrap;
  margin-bottom: 2px;
}
.color-scale-vertical {
  display: flex;
  flex-direction: row;
  gap: 0;
  align-items: stretch;
}
.color-scale-bar-v {
  width: 16px;
  border-radius: 4px;
  height: 180px;
  flex-shrink: 0;
}
.color-scale-labels-v {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding-left: 5px;
  height: 180px;
  overflow: hidden;
}
.color-scale-labels-v span {
  font-size: 9px;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  line-height: 1;
  white-space: nowrap;
}

/* ── 右側面板 ── */
.side-panel {
  width: 380px;
  flex-shrink: 0;
  background: var(--surface);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: width 0.25s ease, border-color 0.25s ease;
  position: relative;
}
.side-panel.collapsed {
  width: 0;
  border-left-color: transparent;
  overflow: hidden;
  pointer-events: none;
}
.side-panel-toggle {
  position: absolute;
  right: 380px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 600;
  width: 22px;
  height: 48px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-right: none;
  border-radius: 6px 0 0 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 14px;
  line-height: 1;
  transition: right 0.25s ease, background 0.15s, color 0.15s;
  box-shadow: -2px 0 6px rgba(0,0,0,0.12);
  padding: 0;
}
.side-panel.collapsed ~ * .side-panel-toggle,
.content-wrap.panel-collapsed .side-panel-toggle {
  right: 0;
}
.side-panel-toggle:hover {
  background: var(--surface2);
  color: var(--accent);
}
.panel-header {
  padding: 10px 16px 8px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 0;
}
.panel-header-left { flex: 1; min-width: 0; }
.panel-title { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.panel-subtitle { font-size: 11px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
.panel-rain-days {
  display: none;
  flex-direction: column;
  gap: 3px;
  flex-shrink: 0;
  align-items: flex-end;
}
.panel-rain-days.visible { display: flex; }
.rain-day-row {
  display: flex;
  gap: 3px;
  flex-wrap: nowrap;
}
.rain-day-btn {
  padding: 2px 7px; border-radius: 20px; font-size: 10px; cursor: pointer;
  border: 1px solid var(--border); background: transparent; color: var(--text-muted);
  font-family: 'Noto Sans TC', sans-serif; transition: all 0.15s; white-space: nowrap;
  text-align: center; line-height: 1.5;
}
.rain-day-btn:hover { color: var(--text); border-color: var(--text-muted); }
.rain-day-btn.active { background: #38bdf8; border-color: #38bdf8; color: #fff; }

/* 搜尋 */
.search-box {
  padding: 6px 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  display: flex;
  gap: 6px;
  align-items: center;
}
.search-input {
  flex: 1;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 9px; color: var(--text);
  font-size: 12px; font-family: 'Noto Sans TC', sans-serif; outline: none;
  transition: border-color 0.2s;
}
.search-input::placeholder { color: var(--text-muted); }
.search-input:focus { border-color: var(--accent); }

/* 縣市 checkbox dropdown */
.county-dropdown { position: relative; flex-shrink: 0; }
.county-dropdown-btn {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 8px; color: var(--text);
  font-size: 11px; font-family: 'Noto Sans TC', sans-serif; outline: none;
  cursor: pointer; display: flex; align-items: center; gap: 4px; white-space: nowrap;
  transition: border-color 0.2s;
}
.county-dropdown-btn:hover { border-color: var(--accent); }
.county-dropdown-btn.active { border-color: var(--accent); color: var(--accent); }
.county-dropdown-arrow { font-size: 10px; color: var(--text-muted); }
.county-dropdown-menu {
  display: none; position: absolute; top: calc(100% + 4px); right: 0;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; z-index: 900; min-width: 130px; max-height: 280px;
  overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  padding: 4px 0;
}
.county-dropdown-menu.open { display: block; }
.county-hint {
  font-size: 10px; color: var(--text-muted); padding: 4px 10px 6px;
  font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid var(--border);
}
.county-cb-item {
  display: flex; align-items: center; gap: 7px;
  padding: 5px 10px; font-size: 12px; cursor: pointer;
  font-family: 'Noto Sans TC', sans-serif; transition: background 0.12s;
}
.county-cb-item:hover { background: var(--surface2); }
.county-cb-item input[type="checkbox"] { accent-color: var(--accent); cursor: pointer; }
.county-cb-item.disabled { opacity: 0.4; pointer-events: none; }

/* 排序按鈕列 */
.panel-tabs {
  display: flex;
  padding: 4px 10px;
  gap: 6px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  align-items: center;
  height: 30px;
}
.sort-btn {
  padding: 3px 10px; border-radius: 20px; font-size: 11px;
  cursor: pointer; border: 1px solid var(--border);
  background: transparent; color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace; transition: all 0.15s;
  display: flex; align-items: center; gap: 4px;
}
.sort-btn:hover { color: var(--text); border-color: var(--text-muted); }
.sort-btn.asc { border-color: var(--accent); color: var(--accent); background: rgba(88,166,255,0.08); }

/* 測站列表 */
.station-list {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.station-item {
  display: flex; align-items: center;
  padding: 4px 10px;
  border-bottom: 1px solid rgba(128,128,128,0.07);
  cursor: pointer; transition: background 0.12s; gap: 7px; min-width: 0;
  flex-shrink: 0;
}
.station-item:hover { background: var(--surface2); }
.station-item.active { background: rgba(88,166,255,0.08); border-left: 2px solid var(--accent); padding-left: 8px; }
.station-rank {
  font-size: 9px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace;
  min-width: 22px; text-align: right; flex-shrink: 0;
}
.station-color-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  border: 1px solid rgba(255,255,255,0.2);
}
.station-name {
  font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; flex: 1 1 0; min-width: 0;
}
.station-id-tag {
  font-size: 9px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace;
  flex-shrink: 0; white-space: nowrap;
}
.station-loc {
  font-size: 9px; color: var(--text-muted); flex-shrink: 0; white-space: nowrap;
  max-width: 70px; overflow: hidden; text-overflow: ellipsis;
}
.station-value {
  font-size: 11px; font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
  min-width: 52px; text-align: right; color: var(--text); flex-shrink: 0;
}
.station-weather-text {
  font-size: 11px; font-weight: 600;
  font-family: 'Noto Sans TC', sans-serif;
  min-width: 52px; text-align: right; color: var(--text); flex-shrink: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90px;
}

/* 彈出時序 Modal */
.detail-modal {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: 2000; display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
  opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.detail-modal.open { opacity: 1; pointer-events: all; }
.modal-content {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; width: min(1100px, 96vw); max-height: 90vh;
  display: flex; flex-direction: column; overflow: hidden;
  transform: translateY(10px); transition: transform 0.2s;
}
.detail-modal.open .modal-content { transform: translateY(0); }
.modal-header {
  padding: 14px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  flex-shrink: 0;
}
.modal-station-name { font-size: 18px; font-weight: 700; }
.modal-meta {
  font-size: 12px; color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  margin-top: 2px; display: flex; gap: 12px; align-items: center;
}
.modal-obs-chips {
  display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 20px;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.obs-chip {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 5px 10px;
}
.obs-chip-icon { font-size: 14px; }
.obs-chip-label { font-size: 11px; color: var(--text-muted); }
.obs-chip-val { font-size: 14px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
.obs-chip-unit { font-size: 11px; color: var(--text-muted); }
.obs-chip-time { font-size: 10px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; opacity: 0.75; }
.modal-close {
  background: none; border: 1px solid var(--border); color: var(--text-muted);
  width: 30px; height: 30px; border-radius: 6px; cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center; transition: all 0.15s;
  flex-shrink: 0;
}
.modal-close:hover { border-color: #da3633; color: #da3633; }
.hours-tabs {
  display: flex; gap: 6px; padding: 10px 20px;
  border-bottom: 1px solid var(--border); flex-shrink: 0; align-items: center;
}
.hours-tab {
  padding: 4px 14px; border-radius: 20px; font-size: 12px; cursor: pointer;
  border: 1px solid var(--border); background: transparent; color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace; transition: all 0.15s;
}
.hours-tab:hover { color: var(--text); }
.hours-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.modal-body {
  flex: 1; overflow-y: auto; padding: 14px 20px;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-content: start;
}
.chart-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px;
}
.chart-card-title { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 4px; }
.wind-arrow-row { width: 100%; height: 28px; position: relative; margin-bottom: 2px; }
.wind-arrow-canvas { width: 100%; height: 28px; display: block; }
.chart-wrapper { position: relative; height: 140px; }

/* Leaflet */
.leaflet-container { background: var(--map-bg) !important; }
.cwa-marker { display: flex; align-items: center; justify-content: center; }
.cwa-dot {
  border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.4);
  cursor: pointer; transition: transform 0.15s;
}
.cwa-dot:hover { transform: scale(1.5); border-color: rgba(255,255,255,0.9); }
.leaflet-popup-content-wrapper {
  background: var(--surface) !important; border: 1px solid var(--border) !important;
  border-radius: 10px !important; box-shadow: 0 8px 24px rgba(0,0,0,0.3) !important;
  color: var(--text) !important;
}
.leaflet-popup-tip { background: var(--surface) !important; }
.leaflet-popup-content { margin: 12px 14px !important; font-family: 'Noto Sans TC', sans-serif; min-width: 260px; }
.popup-name { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
.popup-meta { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; font-family: 'JetBrains Mono', monospace; }
.popup-obs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 8px; }
.popup-obs-item { display: flex; align-items: baseline; gap: 4px; font-size: 12px; white-space: nowrap; }
.popup-obs-label { color: var(--text-muted); font-size: 11px; white-space: nowrap; }
.popup-obs-val { font-family: 'JetBrains Mono', monospace; font-weight: 600; white-space: nowrap; }
.popup-obs-unit { color: var(--text-muted); font-size: 10px; white-space: nowrap; }
.popup-detail-btn {
  margin-top: 4px; width: 100%; padding: 6px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 6px; color: var(--accent); font-size: 12px; cursor: pointer;
  font-family: 'Noto Sans TC', sans-serif; transition: background 0.15s;
}
.popup-detail-btn:hover { background: rgba(88,166,255,0.1); }
.county-tooltip {
  background: var(--surface) !important; border: 1px solid var(--border) !important;
  color: var(--text) !important; font-family: 'Noto Sans TC', sans-serif !important;
  font-size: 12px !important; padding: 4px 8px !important; border-radius: 4px !important;
}
/* 縮小圖層切換按鈕 30%（zoom 按鈕不變） */
.leaflet-control-layers {
  transform: scale(0.7);
  transform-origin: top left;
}

/* 載入 */
.loading-overlay {
  position: fixed; inset: 0; background: var(--bg); z-index: 3000;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; transition: opacity 0.5s;
}
.loading-overlay.hidden { opacity: 0; pointer-events: none; }
.loading-spinner {
  width: 36px; height: 36px; border: 3px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 14px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ══════════════════════════════════════════════════════════
   手機版 RWD (≤ 768px)
══════════════════════════════════════════════════════════ */
@media (max-width: 768px) {
  /* Header 緊湊化 */
  header {
    padding: 0 10px;
    height: 44px;
    gap: 6px;
  }
  .logo { font-size: 12px; }
  .header-stats { display: none; }           /* 統計列手機隱藏，節省空間 */
  .status-badge { display: none; }
  .last-update { font-size: 10px; }
  #obsTime { font-size: 10px; }
  .refresh-btn { padding: 3px 7px; font-size: 11px; }
  .theme-toggle { padding: 3px 7px; font-size: 11px; }
  .author-credit { display: none; }         /* 作者資訊手機隱藏 */

  /* body 改為可滾動，避免 100vh 鎖死 */
  body { height: 100dvh; overflow: hidden; }

  /* 工具列：單列可橫向滾動 */
  .elem-toolbar {
    padding: 3px 8px;
    flex-direction: row;
    overflow-x: auto;
    scrollbar-width: none;
    gap: 0;
    height: 36px;
    align-items: center;
  }
  .elem-toolbar::-webkit-scrollbar { display: none; }
  .elem-toolbar-row {
    display: contents; /* 讓兩列按鈕都在同一橫向排 */
  }
  .toolbar-divider { margin: 0 3px; height: 16px; }
  .elem-btn {
    padding: 3px 7px;
    font-size: 10px;
    gap: 3px;
    flex-shrink: 0;
  }
  .elem-icon { font-size: 11px; }
  .elem-name { display: none; }   /* 手機只顯示圖示+單位，省空間 */
  .elem-unit { font-size: 9px; opacity: 0.8; display: inline; }
  /* 目前選中的按鈕顯示名稱 */
  .elem-btn.active .elem-name { display: inline; font-size: 10px; }

  /* 版面：地圖全寬，側欄改成底部抽屜 */
  .content-wrap {
    flex-direction: column;
  }
  .map-area {
    flex: 1;
    min-height: 0;
  }

  /* 側欄：從底部滑出，高度佔一半螢幕 */
  .side-panel {
    width: 100% !important;
    height: 46vh;
    min-height: 0;
    border-left: none;
    border-top: 2px solid var(--border);
    flex-shrink: 0;
    transition: height 0.25s ease;
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .side-panel.collapsed {
    height: 0;
    border-top-color: transparent;
    width: 100% !important;
  }

/* 手機版：顯示列表收合按鈕，隱藏舊的浮動 toggle */
  .mobile-list-btn { display: flex; align-items: center; gap: 4px; }
  .side-panel-toggle { display: none !important; }

/* 側欄收合按鈕：手機版改 fixed，永遠不被 overflow:hidden 裁切 */
  .side-panel-toggle {
    position: fixed !important;
    left: 50%;
    transform: translateX(-50%) !important;
    right: auto !important;
    top: auto !important;
    bottom: 46vh;           /* 預設：貼在 panel 頂端 */
    width: 56px;
    height: 20px;
    border-radius: 6px 6px 0 0;
    border: 1px solid var(--border);
    border-bottom: none;
    font-size: 11px;
    box-shadow: 0 -2px 6px rgba(0,0,0,0.15);
    background: var(--surface);
    color: var(--text-muted);
    z-index: 700;
    order: 0;
    transition: bottom 0.25s ease, background 0.15s;
  }
  .side-panel-toggle:hover {
    background: var(--surface2);
    color: var(--accent);
  }

  .side-panel-toggle.panel-collapsed {
    bottom: 0;
    border-radius: 6px 6px 0 0;
    border-bottom: none;
  }

  /* panel header 更緊湊 */
  .panel-header { padding: 6px 10px 5px; }
  .panel-title { font-size: 12px; }
  .panel-subtitle { font-size: 10px; }

  /* 搜尋列縮小 */
  .search-box { padding: 4px 8px; gap: 4px; }
  .search-input { font-size: 11px; padding: 4px 7px; }
  .county-dropdown-btn { font-size: 10px; padding: 4px 6px; }

  /* 排序列縮小 */
  .panel-tabs { height: 26px; padding: 2px 8px; }
  .sort-btn { font-size: 10px; padding: 2px 7px; }

  /* 測站列表：手機只顯示前5筆（JS 控制），每項更緊湊 */
  .station-item { padding: 5px 10px; gap: 6px; }
  .station-rank { font-size: 9px; min-width: 16px; }
  .station-color-dot { width: 7px; height: 7px; }
  .station-name { font-size: 11px; }
  .station-id-tag { display: none; }  /* 手機隱藏站碼 */
  .station-loc { font-size: 9px; max-width: 56px; }
  .station-value { font-size: 11px; min-width: 44px; }
  .station-weather-text { font-size: 10px; min-width: 44px; max-width: 72px; }

  /* 色階面板縮小，確保數字和色條對齊 */
  .color-scale-panel { padding: 6px 7px; bottom: 16px; }
  .color-scale-bar-v { width: 10px; height: 100px; border-radius: 3px; }
  .color-scale-labels-v { height: 100px; overflow: hidden; }
  .color-scale-labels-v span { font-size: 7px; white-space: nowrap; }
  .color-scale-title { font-size: 7px; }

  /* Modal 全螢幕 */
  .modal-content {
    width: 100vw;
    max-height: 100dvh;
    border-radius: 0;
    margin: 0;
  }
  .detail-modal { align-items: flex-end; }
  .modal-header { padding: 10px 14px; }
  .modal-station-name { font-size: 15px; }
  .modal-meta { font-size: 11px; gap: 8px; }
  .modal-obs-chips { padding: 8px 12px; gap: 5px; }
  .obs-chip { padding: 4px 7px; gap: 4px; }
  .obs-chip-icon { font-size: 12px; }
  .obs-chip-label { font-size: 10px; }
  .obs-chip-val { font-size: 12px; }
  .obs-chip-unit { font-size: 10px; }

  .hours-tabs { padding: 6px 12px; gap: 4px; }
  .hours-tab { padding: 3px 10px; font-size: 11px; }
  .modal-body {
    grid-template-columns: 1fr 1fr;
    padding: 10px 12px;
    gap: 8px;
  }
  .chart-wrapper { height: 110px; }
  .chart-card { padding: 8px; }
  .chart-card-title { font-size: 10px; margin-bottom: 3px; }
  .wind-arrow-row { height: 22px; }
  .wind-arrow-canvas { height: 22px; }

  /* Leaflet popup 手機寬度 */
  .leaflet-popup-content { min-width: 200px; }
  .popup-name { font-size: 13px; }
  .popup-obs-grid { grid-template-columns: 1fr 1fr; }

    color: var(--accent); cursor: pointer; font-family: 'Noto Sans TC', sans-serif;
    flex-shrink: 0;
  }
}

<script>
// ══════════════════════════════════════════════════════════
// 設定
// ══════════════════════════════════════════════════════════
const WORKER_URL = "https://cwa-monitor.keelungcwb.workers.dev";

// ══════════════════════════════════════════════════════════
// 能見度字串轉數值（km，取區間代表值）
// ══════════════════════════════════════════════════════════
function parseVisibility(raw) {
  if (raw == null) return null;
  const s = String(raw).trim();
  if (s === "" || s === "-") return null;
  // ">30" 或 ">10" → 取下界 + 5
  const gt = s.match(/^[>＞]\s*(\d+(?:\.\d+)?)/);
  if (gt) return Number(gt[1]) + 5;
  // "a-b" 或 "a~b" → 取中間值
  const range = s.match(/^(\d+(?:\.\d+)?)\s*[-~～]\s*(\d+(?:\.\d+)?)/);
  if (range) return (Number(range[1]) + Number(range[2])) / 2;
  // 純數字（公里）
  const num = Number(s);
  if (!isNaN(num)) return num;
  return null;
}

// 蒲福風級換算
function beaufortLevel(ms) {
  if (ms == null || isNaN(ms)) return null;
  const v = Number(ms);
  if (v < 0.3)  return 0;
  if (v < 1.6)  return 1;
  if (v < 3.4)  return 2;
  if (v < 5.5)  return 3;
  if (v < 8.0)  return 4;
  if (v < 10.8) return 5;
  if (v < 13.9) return 6;
  if (v < 17.2) return 7;
  if (v < 20.8) return 8;
  if (v < 24.5) return 9;
  if (v < 28.5) return 10;
  if (v < 32.7) return 11;
  return 12;
}

// 氣象要素定義
const ELEMENTS = {
  temp:   { key: "temp",   label: "氣溫",     unit: "°C",   icon: "🌡", chartColor: "#f97316",
            scale: { min: -1, max: 42, stops: [
              [0,    "#0a2d6e"],
              [0.07, "#1155aa"],
              [0.14, "#2980c8"],
              [0.21, "#55b8e0"],
              [0.279,"#1a6e3c"],

function getWeatherColor(weatherStr) {
  if (!weatherStr) return "#9E9E9E";
  const s = weatherStr;
  if (s.includes("雷"))                       return "#7e22ce";
  if (s.includes("雹"))                       return "#ef4444";
  if (s.includes("冰") || s.includes("雪"))   return "#ffffff";
  if (s.includes("雨"))                       return "#1e40af";
  if (s.includes("霧") || s.includes("靄"))   return "#654321";
  if (s.includes("晴"))                       return "#FFD700";
  if (s.includes("多雲"))                     return "#70d9e7";
  if (s.includes("陰"))                       return "#BDBDBD";
  return "#9E9E9E";
}

// ══════════════════════════════════════════════════════════
// 色彩插值
// ══════════════════════════════════════════════════════════
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return [r,g,b];
}
function rgbToHex(r,g,b) {
  return "#" + [r,g,b].map(v=>Math.round(v).toString(16).padStart(2,"0")).join("");
}
function interpolateColor(stops, t) {
  t = Math.max(0, Math.min(1, t));
  let i = 0;
  for (i = 0; i < stops.length-1; i++) {
    if (t <= stops[i+1][0]) break;
  }
  const [t0, c0] = stops[i];
  const [t1, c1] = stops[Math.min(i+1, stops.length-1)];
  const f = t1 === t0 ? 0 : (t-t0)/(t1-t0);
  const [r0,g0,b0] = hexToRgb(c0);
  const [r1,g1,b1] = hexToRgb(c1);
  return rgbToHex(r0+(r1-r0)*f, g0+(g1-g0)*f, b0+(b1-b0)*f);
}

function getElemColor(elemKey, value) {
  if (elemKey === "weather") return getWeatherColor(value);
  const cfg = ELEMENTS[elemKey];
  if (!cfg || !cfg.scale) return "#64748b";
  if (value == null || value === undefined) return "#555";
  // vis 可能是字串，先轉數值
  const v = (elemKey === "vis" && typeof value !== "number") ? parseVisibility(value) : value;
  if (v == null) return "#555";
  const t = (v - cfg.scale.min) / (cfg.scale.max - cfg.scale.min);
  return interpolateColor(cfg.scale.stops, t);
}

function updateColorScale() {
  const cfg = ELEMENTS[currentElem];
  document.getElementById("scaleTitle").textContent = `${cfg.label}${cfg.unit ? ' ('+cfg.unit+')' : ''}`;

  if (currentElem === "weather") {
    document.getElementById("scalePanel").style.display = "flex";
    document.getElementById("scaleBar").style.background = "none";
    document.getElementById("scaleBar").style.width = "0";
    // 用 labels 區顯示天氣圖例
    document.getElementById("scaleLabels").style.height = "auto";
    document.getElementById("scaleLabels").style.justifyContent = "flex-start";
    document.getElementById("scaleLabels").style.gap = "5px";
    document.getElementById("scaleLabels").innerHTML = WEATHER_LEGEND.slice(0, -1).map(w =>
      `<span style="display:flex;align-items:center;gap:4px;">
        <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${w.color};border:1px solid rgba(128,128,128,0.4);flex-shrink:0;"></span>
        <span>${w.text}</span>
      </span>`
    ).join("");
    return;
  }

  // 還原 labels 樣式（切換回其他要素時）
  const labelsEl = document.getElementById("scaleLabels");
  const barEl = document.getElementById("scaleBar");
  labelsEl.style.height = "";        // 讓 CSS 控制高度（桌機180px、手機100px）
  labelsEl.style.justifyContent = "space-between";
  labelsEl.style.gap = "";
  barEl.style.width = "";            // 讓 CSS 控制寬度

  if (!cfg.scale) {
    document.getElementById("scalePanel").style.display = "none";
    return;
  }
  document.getElementById("scalePanel").style.display = "flex";

  const s = cfg.scale;
  const stops = [...s.stops].reverse().map(([t, c]) => `${c} ${((1-t)*100).toFixed(0)}%`).join(", ");
  document.getElementById("scaleBar").style.background = `linear-gradient(to bottom, ${stops})`;

  const n = 5;
  const labels = [];
  for (let i = 0; i <= n; i++) {
    const v = s.max - (s.max - s.min) * i / n;
    labels.push(`<span>${v % 1 === 0 ? v : v.toFixed(1)}</span>`);
  }
  document.getElementById("scaleLabels").innerHTML = labels.join("");
}

async function loadCountyBoundary() {
  try {
    const res = await fetch("twcounty2010.3.json");
    if (!res.ok) return;
    const geojson = await res.json();
    countyLayer = L.geoJSON(geojson, {
      style: { color: "#58a6ff", weight: 1.5, opacity: 0.4, fillOpacity: 0 },
      onEachFeature: (f, layer) => {
        const name = f.properties?.COUNTYNAME || f.properties?.name || "";
        if (name) layer.bindTooltip(name, { permanent: false, className: "county-tooltip", direction: "center" });
      }
    }).addTo(map);
  } catch(e) { /* silent */ }
}

async function loadData() {
  try {
    const res = await fetch(`${WORKER_URL}/api/stations`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    allStations = await res.json();

    // 正規化各站 weather_elements
    Object.values(allStations).forEach(s => {
      const we = s.weather_elements || {};
      // 日溫差
      if (we.dHigh != null && we.dLow != null) {
        we.dRange = Math.round((we.dHigh - we.dLow) * 10) / 10;
      }
      // 能見度：API 可能用 visibility，轉成數值存到 vis
      if (we.vis == null && we.visibility != null) {
        we.vis = parseVisibility(we.visibility);
      } else if (we.vis != null && typeof we.vis !== "number") {
        we.vis = parseVisibility(we.vis);
      }
      // 紫外線：確保是數值
      if (we.uv != null && typeof we.uv !== "number") {
        const n = Number(we.uv);
        we.uv = isNaN(n) ? null : n;
      }
    });

    // === DEBUG: 印出前3個測站的 weather_elements，協助排查 vis/uv ===
    const debugStations = Object.values(allStations).slice(0, 3);
    debugStations.forEach(s => {
      const we = s.weather_elements || {};
      console.log(`[DEBUG] ${s.station_name} weather_elements keys:`, Object.keys(we));
      console.log(`[DEBUG] ${s.station_name} vis=${we.vis}, visibility=${we.visibility}, uv=${we.uv}`);
    });
    // === END DEBUG ===

    renderMap();
    renderList();
    renderStats();
    updateColorScale();

    const now = new Date().toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit" });
    document.getElementById("lastUpdate").textContent = `更新 ${now}`;
    document.getElementById("statusText").textContent = "連線正常";
    document.getElementById("statusDot").style.background = "var(--green)";
    document.getElementById("countTotal").textContent = Object.keys(allStations).length;
    const ct2 = document.getElementById("countTotal2");
    if (ct2) ct2.textContent = Object.keys(allStations).length;

    // 顯示最新觀測時間
    const times = Object.values(allStations).map(s => s.obs_time).filter(Boolean).sort();
    if (times.length) {
      const latest = new Date(times[times.length - 1]);
      const obsStr = latest.toLocaleString("zh-TW", { month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hour12:false });
      document.getElementById("obsTime").textContent = `觀測 ${obsStr}`;
    }
  } catch(e) {
    console.error("載入失敗:", e);
    document.getElementById("statusText").textContent = "連線失敗";
    document.getElementById("statusDot").style.background = "#da3633";
  } finally {
    document.getElementById("loadingOverlay").classList.add("hidden");
  }
}

// ══════════════════════════════════════════════════════════
// 地圖渲染（依目前要素著色）
// ══════════════════════════════════════════════════════════
function renderMap() {
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};

  const isWind = currentElem === "wSpeed" || currentElem === "gust";
  const sparseElems = new Set(["uv", "vis", "wSpeed", "gust", "pres", "weather"]);

  Object.values(allStations).forEach(station => {
    if (!station.lat || !station.lon) return;
    const we = station.weather_elements || {};
    const val = we[currentElem];
    // UV / 能見度：無資料的站直接跳過，不畫黑點
    if (sparseElems.has(currentElem) && val == null || Number(val) === -99) return;
    const color = getElemColor(currentElem, val);

    let lat = Number(station.lat), lon = Number(station.lon);
    if (!isNaN(lat) && !isNaN(lon) && lat > 90 && lon <= 90) [lat, lon] = [lon, lat];

    let iconHtml, iconSize, iconAnchor;

    if (isWind) {
      // 箭頭圖示，依風向旋轉（wDir: 氣象風向，風從該方向吹來，箭頭指向下風方向）
      const wDir = we.wDir != null ? Number(we.wDir) : null;
      // 氣象風向：0=北風（往南吹），箭頭需指向南→旋轉180°
      const rotation = wDir != null ? wDir + 180 : 0;
      const sz = 16;
      iconHtml = `
        <svg width="${sz}" height="${sz}" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"
             style="transform:rotate(${rotation}deg);display:block;filter:drop-shadow(0 0 3px ${color}99);">
          <polygon points="8,1 12.5,13 8,10.5 3.5,13" fill="${color}" stroke="rgba(255,255,255,0.7)" stroke-width="0.8"/>
        </svg>`;
      iconSize = [sz, sz];
      iconAnchor = [sz/2, sz/2];
    } else {
      const size = 11;
      iconHtml = `<div class="cwa-dot" style="width:${size}px;height:${size}px;background:${color};box-shadow:0 0 6px ${color}88;"></div>`;
      iconSize = [size, size];
      iconAnchor = [size/2, size/2];
    }

    const icon = L.divIcon({
      className: "cwa-marker",
      html: iconHtml,
      iconSize,
      iconAnchor,
    });

    const marker = L.marker([lat, lon], { icon })
      .addTo(map)
      .bindPopup(buildPopupHTML(station), { maxWidth: 500 });

    marker.on("click", () => { activeStationId = station.station_id; });
    markers[station.station_id] = marker;
  });
}

function buildPopupHTML(s) {
  const we = s.weather_elements || {};
  const loc = formatLocation(s);
  const visNum = we.vis != null ? (we.vis % 1 === 0 ? we.vis : Number(we.vis).toFixed(1)) : null;
  const fmtWind = (v) => {
    if (v == null) return null;
    const num = Number(v);
    const disp = num % 1 === 0 ? num : num.toFixed(1);
    return `${disp} (${beaufortLevel(num)}級)`;
  };
  const rows = [
    { icon: "🌡", label: "氣溫",   val: we.temp,               unit: "°C",  dispVal: null },
    { icon: "💧", label: "濕度",   val: we.humi,               unit: "%",   dispVal: null },
    { icon: "💨", label: "風速",   val: we.wSpeed,             unit: "m/s", dispVal: fmtWind(we.wSpeed) },
    { icon: "🌬", label: "最大陣風", val: we.gust,             unit: "m/s", dispVal: fmtWind(we.gust) },
    { icon: "🌧", label: "雨量",   val: we.rain,               unit: "mm",  dispVal: null },
    { icon: "📊", label: "氣壓",   val: we.pres,               unit: "hPa", dispVal: null },
    { icon: "☀️", label: "紫外線", val: we.uv,                 unit: "UVI", dispVal: null },
    { icon: "👁",  label: "能見度", val: visNum,               unit: "km",  dispVal: null },
    { icon: "🌤", label: "天氣",   val: we.weather,            unit: "",    dispVal: null },
  ].filter(r => r.val != null);

  const rowsHtml = rows.map(r => `
    <div class="popup-obs-item">
      <span>${r.icon}</span>
      <span class="popup-obs-label">${r.label}</span>
      <span class="popup-obs-val">${r.dispVal ?? r.val}</span>
      <span class="popup-obs-unit">${r.unit}</span>
    </div>
  `).join("");

  return `
    <div class="popup-name">${s.station_name}</div>
    <div class="popup-meta">${s.station_id} · ${loc} · ${s.altitude != null ? s.altitude + 'm' : '—'}</div>
    <div class="popup-obs-grid">${rowsHtml || '<span style="color:var(--text-muted);font-size:11px;">尚無觀測資料</span>'}</div>
    <button class="popup-detail-btn" onclick="openDetail('${s.station_id}')">📈 查看時序圖</button>
  `;
}

function formatLocation(s) {
  const county = s.county || "";
  const district = s.district || s.town || s.township || "";
  if (district && district !== county) return `${county} ${district}`;
  return county || "—";
}

// ══════════════════════════════════════════════════════════
// 統計列更新
// ══════════════════════════════════════════════════════════
function renderStats() {
  const setStats = (min, avg, max) => {
    ["", "2"].forEach(sfx => {
      const el = id => document.getElementById(id + sfx);
      if (el("statMin")) el("statMin").textContent = min;
      if (el("statAvg")) el("statAvg").textContent = avg;
      if (el("statMax")) el("statMax").textContent = max;
    });
  };
  if (currentElem === "weather") {
    setStats("—", "—", "—");
    return;
  }
  const cfg = ELEMENTS[currentElem];
  const vals = Object.values(allStations)
    .map(s => {
      let v = (s.weather_elements || {})[currentElem];
      if (currentElem === "vis") v = typeof v === "number" ? v : parseVisibility(v);
      return v;
    })
    .filter(v => v != null && !isNaN(v));
  if (!vals.length) return;
  const min = Math.min(...vals);
  const max = Math.max(...vals);
  const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
  const fmt = v => v % 1 === 0 ? v : v.toFixed(1);
  setStats(fmt(min) + " " + cfg.unit, fmt(avg) + " " + cfg.unit, fmt(max) + " " + cfg.unit);
  // Also update countTotal in header
  const ct2 = document.getElementById("countTotal2");
  if (ct2) ct2.textContent = document.getElementById("countTotal").textContent;
}

function toggleCountyDropdown(e) {
  e.stopPropagation();

function onCountyChange() {
  const checks = document.querySelectorAll("#countyDropdownMenu input[type=checkbox]");

  // 超過3個：禁用未勾選的

// ══════════════════════════════════════════════════════════
// 測站列表渲染
// ══════════════════════════════════════════════════════════
function renderList() {
  const search = document.getElementById("searchInput").value.toLowerCase();
  const cfg = ELEMENTS[currentElem];
  let stations = Object.values(allStations);

  if (selectedCounties.size > 0) stations = stations.filter(s => selectedCounties.has(s.county));
  if (search) stations = stations.filter(s =>
    (s.station_name||"").toLowerCase().includes(search) ||
    (s.county||"").toLowerCase().includes(search) ||
    (s.town||"").toLowerCase().includes(search) ||
    (s.station_id||"").toLowerCase().includes(search)
  );

  stations.sort((a, b) => {
    // 天氣模式：依測站名稱排序
    if (currentElem === "weather") {
      return (a.station_name || "").localeCompare(b.station_name || "", "zh-TW");
    }
    let va = (a.weather_elements || {})[currentElem];
    let vb = (b.weather_elements || {})[currentElem];
    // vis 可能是字串，轉數值再排序
    if (currentElem === "vis") {
      va = typeof va === "number" ? va : parseVisibility(va);
      vb = typeof vb === "number" ? vb : parseVisibility(vb);
    }
    if (va == null && vb == null) return 0;
    if (va == null) return 1;
    if (vb == null) return -1;
    return sortDir === "desc" ? vb - va : va - vb;
  });

  document.getElementById("panelSubtitle").textContent = `共 ${stations.length} 個測站`;

  const isMobile = window.innerWidth <= 768;
  const MOBILE_LIMIT = 5;
  const displayStations = (isMobile && !document.getElementById("stationList").dataset.showAll)
    ? stations.slice(0, MOBILE_LIMIT)
    : stations;

  const list = document.getElementById("stationList");
  list.innerHTML = displayStations.map((s, idx) => {
    const we = s.weather_elements || {};
    const val = we[currentElem];
    const color = getElemColor(currentElem, val);
    let dispVal;
    if (currentElem === "weather") {
      // 天氣模式：顯示文字天氣描述，不顯示數值
      dispVal = val != null ? String(val) : "—";
    } else if (currentElem === "vis") {
      // vis 已是數值（km），直接顯示；但從 weather_elements 來的可能還是字串
      const visNum = typeof val === "number" ? val : parseVisibility(val);
      dispVal = visNum != null ? (visNum % 1 === 0 ? visNum : visNum.toFixed(1)) + " km" : "—";
    } else if (currentElem === "dHigh" || currentElem === "dLow") {
      const numV = val != null ? (val % 1 === 0 ? val : Number(val).toFixed(1)) : null;
      const timeKey = currentElem === "dHigh" ? "dHighTime" : "dLowTime";
      let timeSuffix = "";
      if (we[timeKey]) {
        try {
          const d = new Date(we[timeKey]);
          timeSuffix = " (" + d.toLocaleTimeString("zh-TW", { hour:"2-digit", minute:"2-digit", hour12:false }) + ")";
        } catch {}
      }
      dispVal = numV != null ? numV + cfg.unit + timeSuffix : "—";
    } else {
      const numV = val != null ? (val % 1 === 0 ? val : Number(val).toFixed(1)) : null;
      if (numV != null && (currentElem === "wSpeed" || currentElem === "gust")) {
        const bf = beaufortLevel(val);
        dispVal = `${numV} ${cfg.unit} (${bf}級)`;
      } else {
        dispVal = numV != null ? numV + cfg.unit : "—";
      }
    }
    const loc = formatLocation(s);
    const rankNum = idx + 1;
    // 天氣模式：隱藏排名序號，天氣文字改用不同樣式
    const isWeather = currentElem === "weather";
    return `
      <div class="station-item ${s.station_id === activeStationId ? 'active' : ''}" onclick="clickStation('${s.station_id}')">
        ${isWeather ? '' : `<span class="station-rank">${rankNum}</span>`}
        <div class="station-color-dot" style="background:${color};box-shadow:0 0 4px ${color}88;"></div>
        <span class="station-name">${s.station_name || s.station_id}</span>
        <span class="station-id-tag">${s.station_id}</span>
        <span class="station-loc">${loc}</span>
        <span class="${isWeather ? 'station-weather-text' : 'station-value'}" style="color:${color}">${dispVal}</span>
      </div>
    `;
  }).join("");

  // 手機版「顯示全部 / 收合」按鈕
  if (isMobile && stations.length > MOBILE_LIMIT) {
    const showAll = list.dataset.showAll === "1";
    const btn = document.createElement("button");
    btn.className = "show-more-btn";
    btn.textContent = showAll ? `▲ 收合` : `▼ 顯示全部 ${stations.length} 站`;
    btn.onclick = () => {
      list.dataset.showAll = showAll ? "" : "1";
      renderList();
    };
    list.appendChild(btn);
  }
}

// ══════════════════════════════════════════════════════════
// 點擊測站
// ══════════════════════════════════════════════════════════
function clickStation(stationId) {
  activeStationId = stationId;
  const s = allStations[stationId];
  if (!s) return;
  if (s.lat && s.lon) {
    let lat = Number(s.lat), lon = Number(s.lon);
    if (!isNaN(lat) && !isNaN(lon) && lat > 90 && lon <= 90) [lat, lon] = [lon, lat];
    map.flyTo([lat, lon], 12, { duration: 0.8 });
    if (markers[stationId]) setTimeout(() => markers[stationId].openPopup(), 800);
  }
  renderList();
  openDetail(stationId);
}

// ══════════════════════════════════════════════════════════
// 時序圖 Modal
// ══════════════════════════════════════════════════════════
async function openDetail(stationId) {
  currentStation = allStations[stationId];
  if (!currentStation) return;

  document.getElementById("modalStationName").textContent = currentStation.station_name || stationId;
  document.getElementById("modalStationId").textContent = stationId;
  document.getElementById("modalCounty").textContent = formatLocation(currentStation);
  document.getElementById("modalAlt").textContent = currentStation.altitude != null ? `海拔 ${currentStation.altitude}m` : "";

  // 觀測時間
  if (currentStation.obs_time) {
    const t = new Date(currentStation.obs_time);
    const tStr = t.toLocaleString("zh-TW", { month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hour12:false });
    document.getElementById("modalAlt").textContent =
      (currentStation.altitude != null ? `海拔 ${currentStation.altitude}m · ` : "") + `觀測時間 ${tStr}`;
  }

  // 即時觀測 chips（先不含能見度，loadHistory 後補入）
  const we = currentStation.weather_elements || {};
  const dRange = (we.dHigh != null && we.dLow != null) ? Math.round((we.dHigh - we.dLow)*10)/10 : null;
  // 紫外線：可能是字串，先轉數值
  const uvNum = we.uv != null ? (typeof we.uv === "number" ? we.uv : Number(we.uv)) : null;
  // 能見度：可能是字串，轉數值供 chip 顯示
  const visNum = we.vis != null ? (typeof we.vis === "number" ? we.vis : parseVisibility(we.vis)) : null;
  const visRawStr = we.vis != null ? String(we.vis) : null;

  // 格式化發生時間（HH:mm）
  const fmtOccurTime = (iso) => {
    if (!iso) return null;
    try {
      const d = new Date(iso);
      return d.toLocaleTimeString("zh-TW", { hour:"2-digit", minute:"2-digit", hour12:false });
    } catch { return null; }
  };
  const dHighTime = fmtOccurTime(we.dHighTime);
  const dLowTime  = fmtOccurTime(we.dLowTime);

  // chips 排序同工具列第一列：🌡🌧💨🌬💧📊🌈 / 第二列：☀️👁🔺🔻↕️
  const chips = [
    { icon:"🌡", label:"氣溫",     val: we.temp,                         unit:"°C",  dispVal: null, timeStr: null },
    { icon:"🌧", label:"雨量",     val: we.rain,                         unit:"mm",  dispVal: null, timeStr: null },
    { icon:"💨", label:"風速",     val: we.wSpeed,                       unit:"m/s", dispVal: null, timeStr: null },
    { icon:"🌬", label:"最大陣風", val: we.gust,                         unit:"m/s", dispVal: null, timeStr: null },
    { icon:"💧", label:"濕度",     val: we.humi,                         unit:"%",   dispVal: null, timeStr: null },
    { icon:"📊", label:"氣壓",     val: we.pres,                         unit:"hPa", dispVal: null, timeStr: null },
    { icon:"🌈", label:"天氣",     val: we.weather,                      unit:"",    dispVal: null, timeStr: null },
    { icon:"☀️", label:"紫外線",   val: isNaN(uvNum) ? null : uvNum,     unit:"UVI", dispVal: null, timeStr: null },
    // 👁 能見度插入在此（index 8，渲染時特殊處理）
    { icon:"🔺", label:"日最高溫", val: we.dHigh,                        unit:"°C",  dispVal: null, timeStr: dHighTime },
    { icon:"🔻", label:"日最低溫", val: we.dLow,                         unit:"°C",  dispVal: null, timeStr: dLowTime },
    { icon:"↕️", label:"日溫差",   val: dRange,                          unit:"°C",  dispVal: null, timeStr: null },
  ].filter(c => c.val != null);

  const makeChipHtml = (c, extraId) => {
    const numVal = typeof c.val === "number" ? c.val : null;
    let display = c.dispVal != null ? c.dispVal
      : numVal != null ? (numVal % 1 === 0 ? numVal : numVal.toFixed(1))
      : c.val;
    // 風速 / 最大陣風：附加蒲福風級
    if ((c.label === "風速" || c.label === "最大陣風") && numVal != null) {
      const bf = beaufortLevel(numVal);
      display = `${display} (${bf}級)`;
    }
    const timeHtml = c.timeStr
      ? `<span class="obs-chip-time">(${c.timeStr})</span>`
      : "";
    return `
    <div class="obs-chip"${extraId ? ` id="${extraId}"` : ''}>
      <span class="obs-chip-icon">${c.icon}</span>
      <span class="obs-chip-label">${c.label}</span>
      <span class="obs-chip-val">${display}</span>
      <span class="obs-chip-unit">${c.unit}</span>${timeHtml}
    </div>`;
  };

  // 能見度 chip：排在紫外線後（位置固定），顯示原始字串
  const visChipHtml = visNum != null
    ? makeChipHtml({ icon:"👁", label:"能見度", val: visNum,
                     dispVal: (visRawStr && visRawStr !== "-") ? visRawStr : null,
                     unit:"km" }, null)
    : `<div class="obs-chip" id="visChipPlaceholder" style="display:none;">
        <span class="obs-chip-icon">👁</span>
        <span class="obs-chip-label">能見度</span>
        <span class="obs-chip-val" id="visChipVal">—</span>
        <span class="obs-chip-unit">km</span>
      </div>`;

  // 插入能見度：在 ☀️紫外線 後（新順序 index 8），其餘後移
  const chipsBeforeVis = chips.filter((_, i) => i < 8);  // 氣溫~紫外線
  const chipsAfterVis  = chips.filter((_, i) => i >= 8); // 日最高溫以後

  document.getElementById("modalObsChips").innerHTML =
    chipsBeforeVis.map(c => makeChipHtml(c, null)).join("") +
    visChipHtml +
    chipsAfterVis.map(c => makeChipHtml(c, null)).join("");

  document.querySelectorAll(".hours-tab").forEach(btn => {
    btn.classList.toggle("active", Number(btn.dataset.hours) === currentHours);
  });
  document.getElementById("detailModal").classList.add("open");
  // 一律抓 72 小時，切換分頁時直接從快取過濾，不重新請求
  await loadHistory(stationId, 72);
}

// ══════════════════════════════════════════════════════════
// 雨量日期選擇
// ══════════════════════════════════════════════════════════
function selectRainDay(rday, doUpdate = true) {
  currentRainDay = rday;
  document.querySelectorAll(".rain-day-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.rday === rday);
  });
  updatePanelTitle();
  if (doUpdate) {
    // 昨日/前日/累積需要至少 72 小時的歷史資料
    const needMore = (rday === "yest" || rday === "d2" || rday === "acc2" || rday === "acc3");
    if (needMore && currentHours < 72 && currentStation) {
      // 靜默升級為 72 小時，更新 chip 後不切換顯示的 tab
      loadHistoryForRain(currentStation.station_id, 72);
    } else {
      updateRainChip();
    }
  }
}

function getRainValue(rday, rows) {
  // 每筆雨量代表「當日到觀測時刻的累積量」
  // 各日取最後一筆 = 當日累積總量
  // 今日      = 今天最後一筆（累積到現在）
  // 昨日      = 昨天最後一筆（昨日全天累積）
  // 前日      = 前天最後一筆（前日全天累積）
  // 前2日累積 = 昨日最後一筆 + 今日最後一筆
  // 前3日累積 = 前日最後一筆 + 昨日最後一筆 + 今日最後一筆

  // 使用台灣時間（UTC+8）判斷日期，避免午夜前後跨日誤判
  const toTWDateStr = (d) => {
    const tw = new Date(d.getTime() + 8 * 3600000);
    return tw.toISOString().slice(0, 10);
  };

  const now = new Date();
  const todayStr = toTWDateStr(now);
  const yestStr  = toTWDateStr(new Date(now.getTime() - 86400000));
  const d2Str    = toTWDateStr(new Date(now.getTime() - 86400000 * 2));

  // 依台灣日期分組
  const byDay = (dateStr) => rows.filter(r => {
    const d = new Date(r.obs_time);
    return !isNaN(d) && toTWDateStr(d) === dateStr;
  });

  // 取某日最後一筆有效雨量（= 當日累積總量）
  const lastRain = (dayRows) => {
    const valid = dayRows.filter(r => r.rain != null);
    return valid.length ? valid[valid.length - 1].rain : null;
  };

  // 今日累積：優先用今天的資料，fallback 到整批最後一筆
  const todayVal = () => {
    const todayRows = byDay(todayStr);
    return lastRain(todayRows.length ? todayRows : rows);
  };

  if (rday === "today") return todayVal();
  if (rday === "yest")  return lastRain(byDay(yestStr));
  if (rday === "d2")    return lastRain(byDay(d2Str));

  if (rday === "acc2") {
    const a = lastRain(byDay(yestStr)); // 昨日全天累積
    const b = todayVal();               // 今日累積到現在
    if (a == null && b == null) return null;
    return (a ?? 0) + (b ?? 0);
  }
  if (rday === "acc3") {
    const a = lastRain(byDay(d2Str));   // 前日全天累積
    const b = lastRain(byDay(yestStr)); // 昨日全天累積
    const c = todayVal();               // 今日累積到現在
    if (a == null && b == null && c == null) return null;
    return (a ?? 0) + (b ?? 0) + (c ?? 0);
  }
  return null;
}

function updateRainChip() {
  // 從 obs chip 區找雨量 chip 並更新顯示
  if (!lastHistoryData.length) return;
  const rows = lastHistoryData.map(normalizeHistoryRow);
  const val = getRainValue(currentRainDay, rows);
  // 找雨量 chip（依 label 找）
  const chips = document.querySelectorAll("#modalObsChips .obs-chip");
  chips.forEach(chip => {
    const label = chip.querySelector(".obs-chip-label");
    if (label && label.textContent === "雨量") {
      const valEl = chip.querySelector(".obs-chip-val");
      const unitEl = chip.querySelector(".obs-chip-unit");
      const labelMap = { today:"今日", yest:"昨日", d2:"前日", acc2:"前2日", acc3:"前3日" };
      label.textContent = `${labelMap[currentRainDay] || ""}雨量`;
      if (valEl) valEl.textContent = val != null ? (val % 1 === 0 ? val : val.toFixed(1)) : "—";
      if (unitEl) unitEl.textContent = "mm";
    }
  });
}

// 僅為更新雨量 chip 而抓取歷史資料（不重繪圖表）
async function loadHistoryForRain(stationId, hours) {
  try {
    const res = await fetch(`${WORKER_URL}/api/station/${stationId}/history?hours=${hours}`);
    const json = await res.json();
    const data = json.data || [];
    lastHistoryData = data;
    updateRainChip();
  } catch(e) {
    console.warn("雨量歷史載入失敗:", e);
  }
}

async function loadHistory(stationId, hours) {
  Object.values(chartInstances).forEach(c => c.destroy());
  chartInstances = {};
  document.getElementById("modalBody").innerHTML = `
    <div style="grid-column:1/-1;display:flex;align-items:center;justify-content:center;height:200px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;font-size:13px;">載入中...</div>
  `;
  try {
    const res = await fetch(`${WORKER_URL}/api/station/${stationId}/history?hours=${hours}`);
    const json = await res.json();
    const data = json.data || [];
    lastHistoryData = data;

    // 回填能見度 chip：從歷史資料找最後一筆有值的能見度
    const placeholder = document.getElementById("visChipPlaceholder");
    if (placeholder) {
      const rows = data.map(normalizeHistoryRow);
      const lastVis = [...rows].reverse().find(r => r.vis != null);
      if (lastVis) {
        const dispText = lastVis.visRaw && lastVis.visRaw !== "-"
          ? lastVis.visRaw
          : (lastVis.vis != null ? String(lastVis.vis) : "—");
        document.getElementById("visChipVal").textContent = dispText;
        placeholder.style.display = "";
      }
    }

    // 依目前選定的時段過濾後繪圖
    const now2 = Date.now();
    const cutoff2 = now2 - currentHours * 60 * 60 * 1000;
    const filtered2 = data.filter(r => new Date(r.obs_time).getTime() >= cutoff2);
    renderCharts(filtered2.length > 0 ? filtered2 : data);
    updateRainChip(); // 更新雨量 chip
  } catch(e) {
    document.getElementById("modalBody").innerHTML = `
      <div style="grid-column:1/-1;color:#da3633;padding:20px;">載入失敗: ${e.message}</div>
    `;
  }
}

function normalizeHistoryRow(row) {
  // 能見度：字串轉數值（km），供色階及圖表使用；同時保留原始字串供顯示
  const visNum = row.visibility != null ? parseVisibility(row.visibility) : null;
  const visRaw = row.visibility != null ? String(row.visibility).trim() : null;
  return {
    obs_time: row.obs_time,
    temp: row.air_temperature != null ? Number(row.air_temperature) : null,
    humi: row.relative_humidity != null ? Number(row.relative_humidity) : null,
    wSpeed: row.wind_speed != null ? Number(row.wind_speed) : null,
    wDir: row.wind_direction != null ? Number(row.wind_direction) : null,
    rain: row.precipitation != null ? Number(row.precipitation) : null,
    pres: row.air_pressure != null ? Number(row.air_pressure) : null,
    gust: row.peak_gust_speed != null ? Number(row.peak_gust_speed) : null,
    dHigh: row.daily_high != null ? Number(row.daily_high) : null,
    dLow: row.daily_low != null ? Number(row.daily_low) : null,
    uv: row.uv_index != null ? Number(row.uv_index) : null,
    vis: visNum,      // 數值（km），用於色階/地圖
    visRaw: visRaw,   // 原始字串，用於表格顯示
  };
}

// ══════════════════════════════════════════════════════════
// 風向箭頭列
// ══════════════════════════════════════════════════════════
function drawWindArrows(arrowCanvas, chartInst, rows) {
  // 等 chart 完成 layout
  const ca = chartInst.chartArea;
  if (!ca) return;

  const wDir = rows.map(r => r.wDir); // 氣象風向（0=北，90=東，依此類推）
  const n = wDir.length;
  if (!n) return;

  const dpr = window.devicePixelRatio || 1;
  const W = arrowCanvas.parentElement.clientWidth;
  const H = 28;
  arrowCanvas.width  = W * dpr;
  arrowCanvas.height = H * dpr;
  arrowCanvas.style.width  = W + "px";
  arrowCanvas.style.height = H + "px";

  const ctx = arrowCanvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  // chart 的繪圖區 X 範圍（對應 arrowCanvas 相同寬度）
  // Chart.js chartArea.left/right 是相對於 chart canvas 自身的像素
  // arrowCanvas 與 chart canvas 同寬，但 chart canvas 可能有 padding
  // 取 chartArea 比例對應到 arrowCanvas 的 X 範圍
  const chartCanvasW = chartInst.canvas.clientWidth || W;
  const scaleLeft  = (ca.left  / chartCanvasW) * W;
  const scaleRight = (ca.right / chartCanvasW) * W;
  const plotW = scaleRight - scaleLeft;

  // X 軸刻度位置：Chart.js scale xAxis
  const xScale = chartInst.scales.x;
  if (!xScale) return;

  // 決定要畫幾個箭頭（最多每 plotW/14px 一個）
  const maxArrows = Math.floor(plotW / 14);
  const step = Math.max(1, Math.round(n / maxArrows));

  const arrowColor = getComputedStyle(document.documentElement).getPropertyValue("--text-muted").trim() || "#888";

  for (let i = 0; i < n; i += step) {
    const dir = wDir[i];
    if (dir == null) continue;

    // X 軸位置
    const px = xScale.getPixelForValue(i);
    const x = (px / chartCanvasW) * W;
    const y = H / 2;

    // 氣象風向：風從該方向「吹來」，箭頭指向「下風方向」= dir + 180
    const angleDeg = dir + 180;
    const angleRad = (angleDeg * Math.PI) / 180;

    const sz = 5.5; // 箭頭半長
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angleRad);
    ctx.strokeStyle = arrowColor;
    ctx.fillStyle   = arrowColor;
    ctx.lineWidth   = 1.3;
    ctx.beginPath();
    // 箭身
    ctx.moveTo(0, sz);
    ctx.lineTo(0, -sz);
    // 箭頭
    ctx.moveTo(0, -sz);
    ctx.lineTo(-3, -sz + 4);
    ctx.moveTo(0, -sz);
    ctx.lineTo( 3, -sz + 4);
    ctx.stroke();
    ctx.restore();
  }
}

function renderCharts(data) {
  const rows = data.map(r => normalizeHistoryRow(r));

  // X 軸標籤：格式 05/15 09，旋轉 90°
  const labels = rows.map(r => {
    const d = new Date(r.obs_time);
    const mm = String(d.getMonth()+1).padStart(2,"0");
    const dd = String(d.getDate()).padStart(2,"0");
    const hh = String(d.getHours()).padStart(2,"0");
    return `${mm}/${dd} ${hh}`;
  });

  const body = document.getElementById("modalBody");
  body.innerHTML = CHART_CONFIGS.map(cfg => {
    const isWind = cfg.key === "wSpeed" || cfg.key === "gust";
    const arrowRow = isWind
      ? `<div class="wind-arrow-row" id="arrow-wrap-${cfg.key}">
           <canvas id="arrow-canvas-${cfg.key}" class="wind-arrow-canvas"></canvas>
         </div>`
      : "";
    return `
    <div class="chart-card">
      <div class="chart-card-title">${cfg.label}${cfg.unit ? ' (' + cfg.unit + ')' : ''}</div>
      ${arrowRow}
      <div class="chart-wrapper" id="wrap-${cfg.key}"><canvas id="chart-${cfg.key}"></canvas></div>
    </div>`;
  }).join("");

  const tc = () => getComputedStyle(document.documentElement).getPropertyValue("--text-muted").trim();
  const sc = () => getComputedStyle(document.documentElement).getPropertyValue("--surface2").trim();
  const bc = () => getComputedStyle(document.documentElement).getPropertyValue("--border").trim();

  const commonOptions = (cfg) => ({
    responsive: true, maintainAspectRatio: false, animation: { duration: 300 },
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: sc(), borderColor: bc(), borderWidth: 1,
        titleColor: tc(),
        bodyColor: getComputedStyle(document.documentElement).getPropertyValue("--text").trim(),
        padding: 8,
        callbacks: { label: ctx => `${ctx.parsed.y !== null ? ctx.parsed.y : "缺測"} ${cfg.unit}` }
      }
    },
    scales: {
      x: {
        ticks: {
          color: tc(), font: { size: 8, family: "JetBrains Mono" },
          maxTicksLimit: currentHours <= 24 ? 12 : 16,
          maxRotation: 90, minRotation: 90,
        },
        grid: { color: "rgba(128,128,128,0.15)" }
      },
      y: { ticks: { color: tc(), font: { size: 9, family: "JetBrains Mono" } }, grid: { color: "rgba(128,128,128,0.15)" } }
    }
  });

  CHART_CONFIGS.forEach(cfg => {
    // ── 能見度：折線（tooltip 顯示原始字串）──
    if (cfg.type === "text") {
      const canvas = document.getElementById(`chart-${cfg.key}`);
      if (!canvas) return;
      const hasData = rows.some(r => r[cfg.key] != null);
      if (!hasData) {
        const wrap = document.getElementById(`wrap-${cfg.key}`);
        if (wrap) wrap.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);font-size:11px;font-family:'JetBrains Mono',monospace;">本站無能見度資料</div>`;
        return;
      }
      const visValues = rows.map(r => r[cfg.key]);
      const visRaws   = rows.map(r => r.visRaw);
      const opts = commonOptions(cfg);
      opts.plugins.tooltip.callbacks.label = ctx => {
        const raw = visRaws[ctx.dataIndex];
        return raw ? `${raw} km` : (ctx.parsed.y != null ? `${ctx.parsed.y} km` : "缺測");
      };
      chartInstances[cfg.key] = new Chart(canvas, {
        type: "line",
        data: { labels, datasets: [{ data: visValues, borderColor: cfg.color, backgroundColor: cfg.color+"22", borderWidth: 1.5, pointRadius: 2, pointHoverRadius: 5, tension: 0.3, fill: true, spanGaps: true }] },
        options: opts,
      });
      return;
    }

    // ── 當日累積雨量：直接顯示原始值（API 回傳已是累積值），折線圖，Y軸從0起 ──
    if (cfg.type === "cumrain") {
      const canvas = document.getElementById(`chart-${cfg.key}`);
      if (!canvas) return;
      const rainValues = rows.map(r => r.rain != null ? r.rain : null);
      const opts = commonOptions(cfg);
      opts.scales.y.min = 0;
      opts.plugins.tooltip.callbacks.label = ctx => `${ctx.parsed.y ?? "缺測"} mm`;
      chartInstances[cfg.key] = new Chart(canvas, {
        type: "line",
        data: { labels, datasets: [{ data: rainValues, borderColor: cfg.color, backgroundColor: cfg.color+"33", borderWidth: 2, pointRadius: 1.5, pointHoverRadius: 5, tension: 0.2, fill: true, spanGaps: true }] },
        options: opts,
      });
      return;
    }

    // ── 一般折線圖 ──
    const canvas = document.getElementById(`chart-${cfg.key}`);
    if (!canvas) return;
    const values = rows.map(r => r[cfg.key] != null ? r[cfg.key] : null);
    chartInstances[cfg.key] = new Chart(canvas, {
      type: "line",
      data: { labels, datasets: [{ data: values, borderColor: cfg.color, backgroundColor: cfg.color+"22", borderWidth: 1.5, pointRadius: 2, pointHoverRadius: 5, tension: 0.3, fill: true, spanGaps: true }] },
      options: commonOptions(cfg),
    });
  });

  // ── 風向箭頭（wSpeed / gust 圖上方） ──
  // 等圖表 layout 完成後才能取得 chartArea，用 requestAnimationFrame 延後
  requestAnimationFrame(() => {
    ["wSpeed", "gust"].forEach(key => {
      const arrowCanvas = document.getElementById(`arrow-canvas-${key}`);
      const chartInst   = chartInstances[key];
      if (!arrowCanvas || !chartInst) return;
      drawWindArrows(arrowCanvas, chartInst, rows);
    });
  });
}

// ══════════════════════════════════════════════════════════
// 事件
// ══════════════════════════════════════════════════════════
document.getElementById("modalClose").addEventListener("click", () => {
  document.getElementById("detailModal").classList.remove("open");
});
document.getElementById("detailModal").addEventListener("click", e => {
  if (e.target === e.currentTarget) e.currentTarget.classList.remove("open");
});
document.querySelectorAll(".hours-tab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".hours-tab").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentHours = parseInt(btn.dataset.hours);
    if (!currentStation || !lastHistoryData.length) return;
    // 用快取資料過濾出對應時段，直接重繪，不重新發請求
    const now = Date.now();
    const cutoff = now - currentHours * 60 * 60 * 1000;
    const filtered = lastHistoryData.filter(r => new Date(r.obs_time).getTime() >= cutoff);
    // 若快取時間不夠長（例如原本只抓 24hr 現在切 72hr），才重新載入
    if (filtered.length < 3 && lastHistoryData.length > 0) {
      loadHistory(currentStation.station_id, currentHours);
    } else {
      Object.values(chartInstances).forEach(c => c.destroy());
      chartInstances = {};
      renderCharts(filtered.length > 0 ? filtered : lastHistoryData);
    }
  });
});
document.getElementById("searchInput").addEventListener("input", () => {
  renderList();
});

// 每30分鐘自動刷新
setInterval(loadData, 30 * 60 * 1000);

// 手機版：把收合按鈕移入 side-panel 頂部（讓它隨側欄一起上下）
function initTogglePlacement() {
  if (window.innerWidth <= 768) {
    const btn = document.getElementById("sidePanelToggle");
    const panel = document.getElementById("sidePanel");
    if (btn && panel && btn.parentElement !== panel) {
      panel.insertBefore(btn, panel.firstChild);
    }
  }
}

// 啟動
initMap();
updateColorScale();
loadData();
initTogglePlacement();
</script>
