<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中央氣象署氣象資料即時監控</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<!-- Chart.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
  --green: #2ea043;
  --green-glow: rgba(46,160,67,0.35);
  --gray: #484f58;
}

[data-theme="dark"] {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #21262d;
  --border: #30363d;
  --text: #e6edf3;
  --text-muted: #7d8590;
  --accent: #58a6ff;
  --map-bg: #1a1f27;
  --legend-bg: rgba(22,27,34,0.92);
  --legend-border: rgba(48,54,61,0.9);
}
[data-theme="light"] {
  --bg: #f0f4f8;
  --surface: #ffffff;
  --surface2: #f0f2f5;
  --border: #d0d7de;
  --text: #1f2328;
  --text-muted: #656d76;
  --accent: #0969da;
  --map-bg: #e8ecf0;
  --legend-bg: rgba(255,255,255,0.95);
  --legend-border: rgba(208,215,222,0.95);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: background 0.3s, color 0.3s;
}

/* ── Header ── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  height: 50px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  z-index: 1000;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.logo { font-size: 15px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.header-right { display: flex; align-items: center; gap: 10px; }
.status-badge { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse-dot 2s ease-in-out infinite; }
@keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.8)} }
.last-update { font-size: 11px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
.theme-toggle {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  padding: 4px 10px; border-radius: 20px; font-size: 13px; cursor: pointer;
  display: flex; align-items: center; gap: 5px; font-family: 'Noto Sans TC', sans-serif;
  transition: all 0.2s;
}
.theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
.refresh-btn {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  padding: 4px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
  font-family: 'Noto Sans TC', sans-serif; transition: all 0.2s;
}
.refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── Stats Bar ── */
.stats-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 5px 20px;
  display: flex;
  align-items: center;
  gap: 20px;
  flex-shrink: 0;
  font-size: 12px;
}
.stat-item { display: flex; align-items: center; gap: 6px; }
.stat-count { font-weight: 700; font-family: 'JetBrains Mono', monospace; }
.stat-label { color: var(--text-muted); }
.stats-bar .divider { width: 1px; height: 14px; background: var(--border); }

/* ── Main Layout ── */
.map-area { display: flex; flex: 1; overflow: hidden; flex-direction: column; }
.content-wrap { display: flex; flex: 1; overflow: hidden; }
.main { display: flex; flex: 1; overflow: hidden; position: relative; }
#map { flex: 1; background: var(--map-bg); }

/* ── 要素工具列（頂端橫式） ── */
.elem-toolbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  height: 44px;
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.elem-toolbar::-webkit-scrollbar { display: none; }
.elem-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 11px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  cursor: pointer;
  font-size: 12px;
  font-family: 'Noto Sans TC', sans-serif;
  color: var(--text-muted);
  transition: all 0.15s;
  white-space: nowrap;
  flex-shrink: 0;
}
.elem-btn:hover { background: var(--surface2); color: var(--text); border-color: var(--text-muted); }
.elem-btn.active { border-color: var(--accent); background: rgba(88,166,255,0.12); color: var(--accent); font-weight: 600; }
.elem-icon { font-size: 13px; }
.elem-unit { font-size: 10px; opacity: 0.7; font-family: 'JetBrains Mono', monospace; }
.toolbar-divider { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; margin: 0 4px; }

/* ── 直式色階（地圖左側） ── */
.color-scale-panel {
  position: absolute;
  top: 50%;
  left: 12px;
  transform: translateY(-50%);
  z-index: 500;
  background: var(--legend-bg);
  border: 1px solid var(--legend-border);
  border-radius: 10px;
  padding: 10px 10px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  min-width: 52px;
}
.color-scale-title {
  font-size: 9px;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  text-align: center;
  white-space: nowrap;
  margin-bottom: 2px;
}
.color-scale-vertical {
  display: flex;
  flex-direction: row;
  gap: 0;
  align-items: stretch;
}
.color-scale-bar-v {
  width: 16px;
  border-radius: 4px;
  height: 180px;
}
.color-scale-labels-v {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding-left: 5px;
  height: 180px;
}
.color-scale-labels-v span {
  font-size: 9px;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  line-height: 1;
}

/* ── 右側面板 ── */
.side-panel {
  width: 380px;
  flex-shrink: 0;
  background: var(--surface);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.panel-header {
  padding: 12px 16px 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.panel-title { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
.panel-subtitle { font-size: 11px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }

/* 搜尋 */
.search-box {
  padding: 8px 14px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  display: flex;
  gap: 6px;
}
.search-input {
  flex: 1;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 10px; color: var(--text);
  font-size: 12px; font-family: 'Noto Sans TC', sans-serif; outline: none;
  transition: border-color 0.2s;
}
.search-input::placeholder { color: var(--text-muted); }
.search-input:focus { border-color: var(--accent); }
.county-select {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 8px; color: var(--text);
  font-size: 12px; font-family: 'Noto Sans TC', sans-serif; outline: none;
  cursor: pointer; min-width: 90px; max-width: 105px;
}
.county-select option { background: var(--surface); color: var(--text); }

/* 面板分頁 */
.panel-tabs {
  display: flex;
  padding: 8px 14px;
  gap: 6px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.panel-tab {
  padding: 4px 12px; border-radius: 20px; font-size: 11px;
  cursor: pointer; border: 1px solid var(--border);
  background: transparent; color: var(--text-muted);
  font-family: 'Noto Sans TC', sans-serif; transition: all 0.2s;
}
.panel-tab:hover { color: var(--text); border-color: var(--text-muted); }
.panel-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* 測站列表 */
.station-list {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
  align-content: start;
}
.station-item {
  display: flex; align-items: center;
  padding: 8px 12px;
  border-bottom: 1px solid rgba(128,128,128,0.1);
  cursor: pointer; transition: background 0.15s; gap: 8px; min-width: 0;
}
.station-item:hover { background: var(--surface2); }
.station-item.active { background: rgba(88,166,255,0.08); border-left: 2px solid var(--accent); padding-left: 10px; }
.station-color-dot {
  width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0;
  border: 1.5px solid rgba(255,255,255,0.25);
}
.station-info { flex: 1; min-width: 0; }
.station-name { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.station-meta { font-size: 10px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
.station-value {
  font-size: 12px; font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
  min-width: 48px; text-align: right; color: var(--text);
}

/* 排行榜 */
.ranking-panel {
  flex: 1; overflow-y: auto;
  scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  display: none;
  flex-direction: column;
}
.ranking-panel.visible { display: flex; }
.rank-section-title {
  padding: 8px 16px 4px;
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1px; color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  background: var(--surface2);
  flex-shrink: 0;
}
.rank-item {
  display: flex; align-items: center;
  padding: 7px 14px; gap: 10px;
  border-bottom: 1px solid rgba(128,128,128,0.08);
  cursor: pointer; transition: background 0.15s;
}
.rank-item:hover { background: var(--surface2); }
.rank-num {
  font-size: 11px; font-weight: 700; min-width: 20px;
  font-family: 'JetBrains Mono', monospace; color: var(--text-muted);
  text-align: center;
}
.rank-num.top3 { color: var(--text); }
.rank-medal { font-size: 14px; }
.rank-info { flex: 1; min-width: 0; }
.rank-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank-loc { font-size: 10px; color: var(--text-muted); }
.rank-value {
  font-size: 15px; font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
  text-align: right;
}
.rank-bar-wrap { width: 60px; height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
.rank-bar { height: 100%; border-radius: 2px; transition: width 0.4s; }

/* 彈出時序 Modal */
.detail-modal {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: 2000; display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
  opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.detail-modal.open { opacity: 1; pointer-events: all; }
.modal-content {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; width: min(1100px, 96vw); max-height: 90vh;
  display: flex; flex-direction: column; overflow: hidden;
  transform: translateY(10px); transition: transform 0.2s;
}
.detail-modal.open .modal-content { transform: translateY(0); }
.modal-header {
  padding: 14px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  flex-shrink: 0;
}
.modal-station-name { font-size: 18px; font-weight: 700; }
.modal-meta {
  font-size: 12px; color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  margin-top: 2px; display: flex; gap: 12px; align-items: center;
}
.modal-obs-chips {
  display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 20px;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.obs-chip {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 5px 10px;
}
.obs-chip-icon { font-size: 14px; }
.obs-chip-label { font-size: 11px; color: var(--text-muted); }
.obs-chip-val { font-size: 14px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
.obs-chip-unit { font-size: 11px; color: var(--text-muted); }
.modal-close {
  background: none; border: 1px solid var(--border); color: var(--text-muted);
  width: 30px; height: 30px; border-radius: 6px; cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center; transition: all 0.15s;
  flex-shrink: 0;
}
.modal-close:hover { border-color: #da3633; color: #da3633; }
.hours-tabs {
  display: flex; gap: 6px; padding: 10px 20px;
  border-bottom: 1px solid var(--border); flex-shrink: 0; align-items: center;
}
.hours-tab {
  padding: 4px 14px; border-radius: 20px; font-size: 12px; cursor: pointer;
  border: 1px solid var(--border); background: transparent; color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace; transition: all 0.15s;
}
.hours-tab:hover { color: var(--text); }
.hours-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.modal-body {
  flex: 1; overflow-y: auto; padding: 14px 20px;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-content: start;
}
.chart-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px;
}
.chart-card-title { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
.chart-wrapper { position: relative; height: 140px; }

/* Leaflet */
.leaflet-container { background: var(--map-bg) !important; }
.cwa-marker { display: flex; align-items: center; justify-content: center; }
.cwa-dot {
  border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.4);
  cursor: pointer; transition: transform 0.15s;
}
.cwa-dot:hover { transform: scale(1.5); border-color: rgba(255,255,255,0.9); }
.leaflet-popup-content-wrapper {
  background: var(--surface) !important; border: 1px solid var(--border) !important;
  border-radius: 10px !important; box-shadow: 0 8px 24px rgba(0,0,0,0.3) !important;
  color: var(--text) !important;
}
.leaflet-popup-tip { background: var(--surface) !important; }
.leaflet-popup-content { margin: 12px 14px !important; font-family: 'Noto Sans TC', sans-serif; }
.popup-name { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
.popup-meta { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; font-family: 'JetBrains Mono', monospace; }
.popup-obs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 8px; }
.popup-obs-item { display: flex; align-items: baseline; gap: 4px; font-size: 12px; }
.popup-obs-label { color: var(--text-muted); font-size: 11px; }
.popup-obs-val { font-family: 'JetBrains Mono', monospace; font-weight: 600; }
.popup-obs-unit { color: var(--text-muted); font-size: 10px; }
.popup-detail-btn {
  margin-top: 4px; width: 100%; padding: 6px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 6px; color: var(--accent); font-size: 12px; cursor: pointer;
  font-family: 'Noto Sans TC', sans-serif; transition: background 0.15s;
}
.popup-detail-btn:hover { background: rgba(88,166,255,0.1); }
.county-tooltip {
  background: var(--surface) !important; border: 1px solid var(--border) !important;
  color: var(--text) !important; font-family: 'Noto Sans TC', sans-serif !important;
  font-size: 12px !important; padding: 4px 8px !important; border-radius: 4px !important;
}

/* 載入 */
.loading-overlay {
  position: fixed; inset: 0; background: var(--bg); z-index: 3000;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; transition: opacity 0.5s;
}
.loading-overlay.hidden { opacity: 0; pointer-events: none; }
.loading-spinner {
  width: 36px; height: 36px; border: 3px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 14px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">載入氣象資料中...</div>
</div>

<header>
  <div class="header-left">
    <div class="logo">⛅ 中央氣象署氣象資料即時監控</div>
  </div>
  <div class="header-right">
    <div class="status-badge">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">連線中</span>
    </div>
    <div class="last-update" id="obsTime" style="color:var(--accent);font-weight:600;">—</div>
    <div class="last-update" id="lastUpdate">—</div>
    <button class="refresh-btn" onclick="loadData()">↺ 刷新</button>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
      <span id="themeIcon">🌙</span>
      <span id="themeLabel">深色</span>
    </button>
  </div>
</header>

<div class="stats-bar">
  <div class="stat-item">
    <span class="stat-count" id="countTotal">0</span>
    <span class="stat-label">測站</span>
  </div>
  <div class="divider"></div>
  <div class="stat-item" id="statCurrentElem">
    <span class="stat-count" id="statMin">—</span>
    <span class="stat-label" id="statMinLabel">最低</span>
  </div>
  <div class="divider"></div>
  <div class="stat-item">
    <span class="stat-count" id="statAvg">—</span>
    <span class="stat-label">平均</span>
  </div>
  <div class="divider"></div>
  <div class="stat-item">
    <span class="stat-count" id="statMax">—</span>
    <span class="stat-label" id="statMaxLabel">最高</span>
  </div>
</div>

<div class="content-wrap">
<div class="map-area">
<!-- 要素工具列 -->
<div class="elem-toolbar" id="elemToolbar">
  <button class="elem-btn active" data-elem="temp" onclick="selectElement('temp')">
    <span class="elem-icon">🌡</span><span class="elem-name">氣溫</span><span class="elem-unit">°C</span>
  </button>
  <button class="elem-btn" data-elem="rain" onclick="selectElement('rain')">
    <span class="elem-icon">🌧</span><span class="elem-name">雨量</span><span class="elem-unit">mm</span>
  </button>
  <button class="elem-btn" data-elem="wSpeed" onclick="selectElement('wSpeed')">
    <span class="elem-icon">💨</span><span class="elem-name">風速</span><span class="elem-unit">m/s</span>
  </button>
  <button class="elem-btn" data-elem="gust" onclick="selectElement('gust')">
    <span class="elem-icon">🌬</span><span class="elem-name">最大陣風</span><span class="elem-unit">m/s</span>
  </button>
  <button class="elem-btn" data-elem="humi" onclick="selectElement('humi')">
    <span class="elem-icon">💧</span><span class="elem-name">濕度</span><span class="elem-unit">%</span>
  </button>
  <button class="elem-btn" data-elem="pres" onclick="selectElement('pres')">
    <span class="elem-icon">📊</span><span class="elem-name">氣壓</span><span class="elem-unit">hPa</span>
  </button>
  <div class="toolbar-divider"></div>
  <button class="elem-btn" data-elem="uv" onclick="selectElement('uv')">
    <span class="elem-icon">☀️</span><span class="elem-name">紫外線</span><span class="elem-unit">UVI</span>
  </button>
  <button class="elem-btn" data-elem="dHigh" onclick="selectElement('dHigh')">
    <span class="elem-icon">🔺</span><span class="elem-name">日最高溫</span><span class="elem-unit">°C</span>
  </button>
  <button class="elem-btn" data-elem="dLow" onclick="selectElement('dLow')">
    <span class="elem-icon">🔻</span><span class="elem-name">日最低溫</span><span class="elem-unit">°C</span>
  </button>
  <button class="elem-btn" data-elem="dRange" onclick="selectElement('dRange')">
    <span class="elem-icon">↕️</span><span class="elem-name">日溫差</span><span class="elem-unit">°C</span>
  </button>
  <button class="elem-btn" data-elem="vis" onclick="selectElement('vis')">

// ══════════════════════════════════════════════════════════
// 狀態
// ══════════════════════════════════════════════════════════
let allStations = {};
let markers = {};
let map;
let activeStationId = null;
let currentHours = 24;
let chartInstances = {};
let currentStation = null;
let currentTheme = "light";
let currentElem = "temp";
let currentView = "list";
let countyLayer = null;
let baseLayers = {};

// ══════════════════════════════════════════════════════════
// 色彩插值
// ══════════════════════════════════════════════════════════
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return [r,g,b];
}
function rgbToHex(r,g,b) {
  return "#" + [r,g,b].map(v=>Math.round(v).toString(16).padStart(2,"0")).join("");
}
function interpolateColor(stops, t) {
  t = Math.max(0, Math.min(1, t));
  let i = 0;
  for (i = 0; i < stops.length-1; i++) {
    if (t <= stops[i+1][0]) break;
  }
  const [t0, c0] = stops[i];
  const [t1, c1] = stops[Math.min(i+1, stops.length-1)];
  const f = t1 === t0 ? 0 : (t-t0)/(t1-t0);
  const [r0,g0,b0] = hexToRgb(c0);
  const [r1,g1,b1] = hexToRgb(c1);
  return rgbToHex(r0+(r1-r0)*f, g0+(g1-g0)*f, b0+(b1-b0)*f);
}

function getElemColor(elemKey, value) {
  const cfg = ELEMENTS[elemKey];
  if (!cfg || !cfg.scale) return "#64748b";
  if (value == null || value === undefined) return "#555";
  const t = (value - cfg.scale.min) / (cfg.scale.max - cfg.scale.min);
  return interpolateColor(cfg.scale.stops, t);
}

// ══════════════════════════════════════════════════════════
// 主題
// ══════════════════════════════════════════════════════════
function toggleTheme() {
  currentTheme = currentTheme === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", currentTheme);
  document.getElementById("themeIcon").textContent = currentTheme === "dark" ? "☀️" : "🌙";
  document.getElementById("themeLabel").textContent = currentTheme === "dark" ? "白天" : "深夜";
  updateBaseLayer();
}

// ══════════════════════════════════════════════════════════
// 要素選擇
// ══════════════════════════════════════════════════════════
function selectElement(elemKey) {
  currentElem = elemKey;
  document.querySelectorAll(".elem-btn").forEach(b => b.classList.toggle("active", b.dataset.elem === elemKey));
  updateColorScale();
  renderMap();
  renderStats();
  if (currentView === "list") renderList();
  else renderRanking();
  updatePanelTitle();
}

function updateColorScale() {
  const cfg = ELEMENTS[currentElem];
  document.getElementById("scaleTitle").textContent = `${cfg.label}${cfg.unit ? ' ('+cfg.unit+')' : ''}`;

  if (!cfg.scale) {
    // 能見度等文字型要素，隱藏色階
    document.getElementById("scalePanel").style.display = "none";
    return;
  }
  document.getElementById("scalePanel").style.display = "flex";

  const s = cfg.scale;
  // 直式色階：由上到下是最大到最小
  const stops = [...s.stops].reverse().map(([t, c]) => `${c} ${((1-t)*100).toFixed(0)}%`).join(", ");
  document.getElementById("scaleBar").style.background = `linear-gradient(to bottom, ${stops})`;

  // 標籤：由上(最大)到下(最小)
  const n = 5;
  const labels = [];
  for (let i = 0; i <= n; i++) {
    const v = s.max - (s.max - s.min) * i / n;
    labels.push(`<span>${v % 1 === 0 ? v : v.toFixed(1)}</span>`);
  }
  document.getElementById("scaleLabels").innerHTML = labels.join("");
}

function updatePanelTitle() {
  const cfg = ELEMENTS[currentElem];
  const viewLabel = currentView === "list" ? "測站列表" : "排行榜 Top20";
  document.getElementById("panelTitle").textContent = `${cfg.icon} ${cfg.label} — ${viewLabel}`;
}

// ══════════════════════════════════════════════════════════
// 面板視圖切換
// ══════════════════════════════════════════════════════════
function switchView(view) {
  currentView = view;
  document.querySelectorAll(".panel-tab").forEach(b => b.classList.toggle("active", b.dataset.view === view));
  document.getElementById("stationList").style.display = view === "list" ? "" : "none";
  const rp = document.getElementById("rankingPanel");
  if (view === "rank") { rp.style.display = "flex"; renderRanking(); }
  else { rp.style.display = "none"; renderList(); }
  updatePanelTitle();
}

// ══════════════════════════════════════════════════════════
// 地圖初始化
// ══════════════════════════════════════════════════════════
function initMap() {
  map = L.map("map", { center: [23.5, 121.0], zoom: 8, zoomControl: true, attributionControl: false });
  baseLayers = {
    "深色": L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", { maxZoom: 18 }),
    "淺色": L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", { maxZoom: 18 }),
    "中文": L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }),
    "衛星": L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 18 }),
    "地形": L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", { maxZoom: 17 }),
  };
  baseLayers["淺色"].addTo(map);
  L.control.layers(baseLayers, {}, { position: "topleft", collapsed: true }).addTo(map);
  L.control.attribution({ prefix: false }).addTo(map);
  loadCountyBoundary();
}

function updateBaseLayer() {
  const target = currentTheme === "light" ? "淺色" : "深色";
  Object.values(baseLayers).forEach(l => { if (map.hasLayer(l)) map.removeLayer(l); });
  baseLayers[target].addTo(map);
}

async function loadCountyBoundary() {
  try {
    const res = await fetch("twcounty2010.3.json");
    if (!res.ok) return;
    const geojson = await res.json();
    countyLayer = L.geoJSON(geojson, {
      style: { color: "#58a6ff", weight: 1.5, opacity: 0.4, fillOpacity: 0 },
      onEachFeature: (f, layer) => {
        const name = f.properties?.COUNTYNAME || f.properties?.name || "";
        if (name) layer.bindTooltip(name, { permanent: false, className: "county-tooltip", direction: "center" });
      }
    }).addTo(map);
  } catch(e) { /* silent */ }
}

// ══════════════════════════════════════════════════════════
// 資料載入
// ══════════════════════════════════════════════════════════
async function loadData() {
  try {
    const res = await fetch(`${WORKER_URL}/api/stations`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    allStations = await res.json();

    // 計算日溫差
    Object.values(allStations).forEach(s => {
      const we = s.weather_elements || {};
      if (we.dHigh != null && we.dLow != null) {
        we.dRange = Math.round((we.dHigh - we.dLow) * 10) / 10;
      }
    });

    renderMap();
    renderList();
    renderStats();
    updateColorScale();

    const now = new Date().toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit" });
    document.getElementById("lastUpdate").textContent = `更新 ${now}`;
    document.getElementById("statusText").textContent = "連線正常";
    document.getElementById("statusDot").style.background = "var(--green)";
    document.getElementById("countTotal").textContent = Object.keys(allStations).length;

    // 顯示最新觀測時間
    const times = Object.values(allStations).map(s => s.obs_time).filter(Boolean).sort();
    if (times.length) {
      const latest = new Date(times[times.length - 1]);
      const obsStr = latest.toLocaleString("zh-TW", { month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hour12:false });
      document.getElementById("obsTime").textContent = `觀測 ${obsStr}`;
    }
  } catch(e) {
    console.error("載入失敗:", e);
    document.getElementById("statusText").textContent = "連線失敗";
    document.getElementById("statusDot").style.background = "#da3633";
  } finally {
    document.getElementById("loadingOverlay").classList.add("hidden");
  }
}

// ══════════════════════════════════════════════════════════
// 地圖渲染（依目前要素著色）
// ══════════════════════════════════════════════════════════
function renderMap() {
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};

  Object.values(allStations).forEach(station => {
    if (!station.lat || !station.lon) return;
    const we = station.weather_elements || {};
    const val = we[currentElem];
    const color = getElemColor(currentElem, val);

    let lat = Number(station.lat), lon = Number(station.lon);
    if (!isNaN(lat) && !isNaN(lon) && lat > 90 && lon <= 90) [lat, lon] = [lon, lat];

    const size = 11;
    const icon = L.divIcon({
      className: "cwa-marker",
      html: `<div class="cwa-dot" style="width:${size}px;height:${size}px;background:${color};box-shadow:0 0 6px ${color}88;"></div>`,
      iconSize: [size, size],
      iconAnchor: [size/2, size/2],
    });

    const marker = L.marker([lat, lon], { icon })
      .addTo(map)
      .bindPopup(buildPopupHTML(station), { maxWidth: 280 });

    marker.on("click", () => { activeStationId = station.station_id; });
    markers[station.station_id] = marker;
  });
}

function buildPopupHTML(s) {
  const we = s.weather_elements || {};
  const loc = formatLocation(s);
  const rows = [
    { icon: "🌡", label: "氣溫", val: we.temp, unit: "°C" },
    { icon: "💧", label: "濕度", val: we.humi, unit: "%" },
    { icon: "💨", label: "風速", val: we.wSpeed, unit: "m/s" },
    { icon: "🌧", label: "雨量", val: we.rain, unit: "mm" },
    { icon: "📊", label: "氣壓", val: we.pres, unit: "hPa" },
    { icon: "🌤", label: "天氣", val: we.weather, unit: "" },
  ].filter(r => r.val != null);

  const rowsHtml = rows.map(r => `
    <div class="popup-obs-item">
      <span>${r.icon}</span>
      <span class="popup-obs-label">${r.label}</span>
      <span class="popup-obs-val">${r.val}</span>
      <span class="popup-obs-unit">${r.unit}</span>
    </div>
  `).join("");

  return `
    <div class="popup-name">${s.station_name}</div>
    <div class="popup-meta">${s.station_id} · ${loc} · ${s.altitude != null ? s.altitude + 'm' : '—'}</div>
    <div class="popup-obs-grid">${rowsHtml || '<span style="color:var(--text-muted);font-size:11px;">尚無觀測資料</span>'}</div>
    <button class="popup-detail-btn" onclick="openDetail('${s.station_id}')">📈 查看時序圖</button>
  `;
}

function formatLocation(s) {
  const county = s.county || "";
  const district = s.district || s.town || s.township || "";
  if (district && district !== county) return `${county} ${district}`;
  return county || "—";
}

// ══════════════════════════════════════════════════════════
// 統計列更新
// ══════════════════════════════════════════════════════════
function renderStats() {
  const cfg = ELEMENTS[currentElem];
  const vals = Object.values(allStations)
    .map(s => (s.weather_elements || {})[currentElem])
    .filter(v => v != null && !isNaN(v));
  if (!vals.length) return;
  const min = Math.min(...vals);
  const max = Math.max(...vals);
  const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
  const fmt = v => v % 1 === 0 ? v : v.toFixed(1);
  document.getElementById("statMin").textContent = fmt(min) + " " + cfg.unit;
  document.getElementById("statMax").textContent = fmt(max) + " " + cfg.unit;
  document.getElementById("statAvg").textContent = fmt(avg) + " " + cfg.unit;
}

// ══════════════════════════════════════════════════════════
// 測站列表渲染
// ══════════════════════════════════════════════════════════
function renderList() {
  const search = document.getElementById("searchInput").value.toLowerCase();
  const county = document.getElementById("countySelect").value;
  const cfg = ELEMENTS[currentElem];
  let stations = Object.values(allStations);

  if (county) stations = stations.filter(s => s.county === county);
  if (search) stations = stations.filter(s =>
    (s.station_name||"").toLowerCase().includes(search) ||
    (s.county||"").toLowerCase().includes(search) ||
    (s.town||"").toLowerCase().includes(search) ||
    (s.station_id||"").toLowerCase().includes(search)
  );

  // Sort by current element value descending
  stations.sort((a, b) => {
    const va = (a.weather_elements || {})[currentElem];
    const vb = (b.weather_elements || {})[currentElem];
    if (va == null && vb == null) return 0;
    if (va == null) return 1;
    if (vb == null) return -1;
    return vb - va;
  });

  document.getElementById("panelSubtitle").textContent = `共 ${stations.length} 個測站`;

  const list = document.getElementById("stationList");
  list.innerHTML = stations.map(s => {
    const we = s.weather_elements || {};
    const val = we[currentElem];
    const color = getElemColor(currentElem, val);
    let dispVal;
    if (currentElem === "vis") {
      dispVal = val != null ? String(val) : "—";
    } else {
      dispVal = val != null ? (val % 1 === 0 ? val : Number(val).toFixed(1)) + " " + cfg.unit : "—";
    }
    const loc = formatLocation(s);
    return `
      <div class="station-item ${s.station_id === activeStationId ? 'active' : ''}" onclick="clickStation('${s.station_id}')">
        <div class="station-color-dot" style="background:${color};box-shadow:0 0 5px ${color}88;"></div>
        <div class="station-info">
          <div class="station-name">${s.station_name || s.station_id}</div>
          <div class="station-meta">${s.station_id} · ${loc}</div>
        </div>
        <div class="station-value">${dispVal}</div>
      </div>
    `;
  }).join("");
}

// ══════════════════════════════════════════════════════════
// 排行榜渲染
// ══════════════════════════════════════════════════════════
function renderRanking() {
  const cfg = ELEMENTS[currentElem];
  let stations = Object.values(allStations).filter(s => {
    const v = (s.weather_elements || {})[currentElem];
    return v != null && !isNaN(v);
  });
  const countyVal = document.getElementById("countySelect").value;
  if (countyVal) stations = stations.filter(s => s.county === countyVal);

  // Sort desc for top, asc for bottom
  const sorted = [...stations].sort((a,b) => {
    const va = (a.weather_elements||{})[currentElem];
    const vb = (b.weather_elements||{})[currentElem];
    return vb - va;
  });
  const top20 = sorted.slice(0, 20);
  const bottom20 = [...stations].sort((a,b) => {
    const va = (a.weather_elements||{})[currentElem];
    const vb = (b.weather_elements||{})[currentElem];
    return va - vb;
  }).slice(0, 20);

  const maxVal = top20.length ? (top20[0].weather_elements||{})[currentElem] : 1;
  const minVal = bottom20.length ? (bottom20[0].weather_elements||{})[currentElem] : 0;

  const medals = ["🥇","🥈","🥉"];

  function renderSection(title, items, isDesc) {
    const refVal = isDesc ? maxVal : Math.abs(minVal) || 1;
    return `
      <div class="rank-section-title">${title}</div>
      ${items.map((s, i) => {
        const val = (s.weather_elements||{})[currentElem];
        const color = getElemColor(currentElem, val);
        const dispVal = currentElem === "vis" ? (val || "—") : (val % 1 === 0 ? val : Number(val).toFixed(1));
        const barPct = isDesc
          ? (Math.abs(val) / Math.abs(maxVal) * 100).toFixed(0)
          : (Math.abs(val) / (Math.abs(minVal) || 1) * 100).toFixed(0);
        const loc = formatLocation(s);
        return `
          <div class="rank-item" onclick="clickStation('${s.station_id}')">
            ${i < 3 ? `<span class="rank-medal">${medals[i]}</span>` : `<span class="rank-num ${i<3?'top3':''}">${i+1}</span>`}
            <div class="rank-info">
              <div class="rank-name">${s.station_name}</div>
              <div class="rank-loc">${loc}</div>
            </div>
            <div class="rank-bar-wrap">
              <div class="rank-bar" style="width:${barPct}%;background:${color};"></div>
            </div>
            <div class="rank-value" style="color:${color};">${dispVal}<span style="font-size:10px;color:var(--text-muted);font-weight:400;"> ${cfg.unit}</span></div>
          </div>
        `;
      }).join("")}
    `;
  }

  const panel = document.getElementById("rankingPanel");
  panel.innerHTML = renderSection(`🔺 ${cfg.rankLabel[0]} Top20`, top20, true)
    + renderSection(`🔻 ${cfg.rankLabel[1]} Top20`, bottom20, false);
}

// ══════════════════════════════════════════════════════════
// 點擊測站
// ══════════════════════════════════════════════════════════
function clickStation(stationId) {
  activeStationId = stationId;
  const s = allStations[stationId];
  if (!s) return;
  if (s.lat && s.lon) {
    let lat = Number(s.lat), lon = Number(s.lon);
    if (!isNaN(lat) && !isNaN(lon) && lat > 90 && lon <= 90) [lat, lon] = [lon, lat];
    map.flyTo([lat, lon], 12, { duration: 0.8 });
    if (markers[stationId]) setTimeout(() => markers[stationId].openPopup(), 800);
  }
  if (currentView === "list") renderList();
  openDetail(stationId);
}

// ══════════════════════════════════════════════════════════
// 時序圖 Modal
// ══════════════════════════════════════════════════════════
async function openDetail(stationId) {
  currentStation = allStations[stationId];
  if (!currentStation) return;

  document.getElementById("modalStationName").textContent = currentStation.station_name || stationId;
  document.getElementById("modalStationId").textContent = stationId;
  document.getElementById("modalCounty").textContent = formatLocation(currentStation);
  document.getElementById("modalAlt").textContent = currentStation.altitude != null ? `海拔 ${currentStation.altitude}m` : "";

  // 觀測時間
  if (currentStation.obs_time) {
    const t = new Date(currentStation.obs_time);
    const tStr = t.toLocaleString("zh-TW", { month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hour12:false });
    document.getElementById("modalAlt").textContent =
      (currentStation.altitude != null ? `海拔 ${currentStation.altitude}m · ` : "") + `觀測時間 ${tStr}`;
  }

  // 即時觀測 chips
  const we = currentStation.weather_elements || {};
  const dRange = (we.dHigh != null && we.dLow != null) ? Math.round((we.dHigh - we.dLow)*10)/10 : null;
  const chips = [
    { icon:"🌡", label:"氣溫",     val: we.temp,   unit:"°C" },
    { icon:"💧", label:"濕度",     val: we.humi,   unit:"%" },
    { icon:"💨", label:"風速",     val: we.wSpeed, unit:"m/s" },
    { icon:"🌬", label:"最大陣風", val: we.gust,   unit:"m/s" },
    { icon:"🌧", label:"雨量",     val: we.rain,   unit:"mm" },
    { icon:"📊", label:"氣壓",     val: we.pres,   unit:"hPa" },
    { icon:"☀️", label:"紫外線",   val: we.uv,     unit:"UVI" },
    { icon:"🔺", label:"日最高溫", val: we.dHigh,  unit:"°C" },
    { icon:"🔻", label:"日最低溫", val: we.dLow,   unit:"°C" },
    { icon:"↕️", label:"日溫差",   val: dRange,    unit:"°C" },
    { icon:"👁", label:"能見度",   val: we.vis,    unit:"" },
    { icon:"🌤", label:"天氣",     val: we.weather, unit:"" },
  ].filter(c => c.val != null);

  document.getElementById("modalObsChips").innerHTML = chips.map(c => `
    <div class="obs-chip">
      <span class="obs-chip-icon">${c.icon}</span>
      <span class="obs-chip-label">${c.label}</span>
      <span class="obs-chip-val">${typeof c.val === 'number' ? (c.val % 1 === 0 ? c.val : c.val.toFixed(1)) : c.val}</span>
      <span class="obs-chip-unit">${c.unit}</span>
    </div>
  `).join("");

  document.querySelectorAll(".hours-tab").forEach(btn => {
    btn.classList.toggle("active", Number(btn.dataset.hours) === currentHours);
  });
  document.getElementById("detailModal").classList.add("open");
  await loadHistory(stationId, currentHours);
}

async function loadHistory(stationId, hours) {
  Object.values(chartInstances).forEach(c => c.destroy());
  chartInstances = {};
  document.getElementById("modalBody").innerHTML = `
    <div style="grid-column:1/-1;display:flex;align-items:center;justify-content:center;height:200px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;font-size:13px;">載入中...</div>
  `;
  try {
    const res = await fetch(`${WORKER_URL}/api/station/${stationId}/history?hours=${hours}`);
    const json = await res.json();
    const data = json.data || [];
    renderCharts(data);
  } catch(e) {
    document.getElementById("modalBody").innerHTML = `
      <div style="grid-column:1/-1;color:#da3633;padding:20px;">載入失敗: ${e.message}</div>
    `;
  }
}

function renderCharts(data) {
  const labels = data.map(r => {
    const d = new Date(r.obs_time);
    return d.toLocaleString("zh-TW", { month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hour12:false }).replace(/\//g,"/");
  });

  const body = document.getElementById("modalBody");
  body.innerHTML = CHART_CONFIGS.map(cfg => `
    <div class="chart-card">
      <div class="chart-card-title">${cfg.label} (${cfg.unit})</div>
      <div class="chart-wrapper"><canvas id="chart-${cfg.key}"></canvas></div>
    </div>
  `).join("");

  const commonOptions = (cfg) => ({
    responsive: true, maintainAspectRatio: false, animation: { duration: 300 },
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: getComputedStyle(document.documentElement).getPropertyValue("--surface2").trim(),
        borderColor: getComputedStyle(document.documentElement).getPropertyValue("--border").trim(),
        borderWidth: 1,
        titleColor: getComputedStyle(document.documentElement).getPropertyValue("--text-muted").trim(),
        bodyColor: getComputedStyle(document.documentElement).getPropertyValue("--text").trim(),
        padding: 8,
        callbacks: { label: ctx => `${ctx.parsed.y !== null ? ctx.parsed.y : "缺測"} ${cfg.unit}` }
      }
    },
    scales: {
      x: { ticks: { color: getComputedStyle(document.documentElement).getPropertyValue("--text-muted").trim(), font:{size:9,family:"JetBrains Mono"}, maxTicksLimit:6, maxRotation:0 }, grid:{color:"rgba(128,128,128,0.15)"} },
      y: { ticks: { color: getComputedStyle(document.documentElement).getPropertyValue("--text-muted").trim(), font:{size:9,family:"JetBrains Mono"} }, grid:{color:"rgba(128,128,128,0.15)"} }
    }
  });

  CHART_CONFIGS.forEach(cfg => {
    const canvas = document.getElementById(`chart-${cfg.key}`);
    if (!canvas) return;
    const values = data.map(r => { const v = r[cfg.key]; return v != null ? v : null; });
    const isBar = cfg.type === "bar";
    chartInstances[cfg.key] = new Chart(canvas, {
      type: isBar ? "bar" : "line",
      data: {
        labels,
        datasets: [{
          data: values,
          borderColor: cfg.color,
          backgroundColor: isBar ? cfg.color+"99" : cfg.color+"22",
          borderWidth: isBar ? 0 : 1.5,
          pointRadius: 2, pointHoverRadius: 5,
          tension: 0.3, fill: !isBar, spanGaps: true,
        }]
      },
      options: commonOptions(cfg),
    });
  });
}

// ══════════════════════════════════════════════════════════
// 事件
// ══════════════════════════════════════════════════════════
document.getElementById("modalClose").addEventListener("click", () => {
  document.getElementById("detailModal").classList.remove("open");
});
document.getElementById("detailModal").addEventListener("click", e => {
  if (e.target === e.currentTarget) e.currentTarget.classList.remove("open");
});
document.querySelectorAll(".hours-tab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".hours-tab").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentHours = parseInt(btn.dataset.hours);
    if (currentStation) loadHistory(currentStation.station_id, currentHours);
  });
});
document.getElementById("searchInput").addEventListener("input", () => {
  if (currentView === "list") renderList(); else renderRanking();
});
document.getElementById("countySelect").addEventListener("change", () => {
  if (currentView === "list") renderList(); else renderRanking();
});

// 每5分鐘自動刷新
setInterval(loadData, 5 * 60 * 1000);

// 啟動
initMap();
updateColorScale();
loadData();
</script>
</body>
